th{font-size:12px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
tr.click{cursor:pointer}tr.click:hover td{background:var(--line-soft)}
.pill{display:inline-block;border-radius:20px;padding:2px 9px;font-size:12px;font-weight:600;white-space:nowrap}
.p-gray{background:var(--gray-soft);color:var(--ink-soft)}.p-blue{background:var(--blue-soft);color:var(--blue)}
.p-green{background:var(--accent-soft);color:var(--accent)}.p-red{background:var(--red-soft);color:var(--red)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.muted{color:var(--ink-soft)}.small{font-size:12.5px}
.notice{background:var(--warn-soft);border:1px solid #f0d3a6;border-radius:8px;padding:9px 12px;margin-bottom:12px}
.notice.ok{background:var(--accent-soft);border-color:#8fd3da}
.notice.err{background:var(--red-soft);border-color:#f3b8b2}
.field{display:flex;flex-direction:column;gap:4px}
.field>label,.lbl{font-weight:600;font-size:13px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.chk{display:flex;align-items:center;gap:8px;padding:5px 0;cursor:pointer}
.chk input{width:18px;height:18px}
.shift{border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px;background:#fff}
.shift .t{font-weight:650;font-size:15px}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs img{width:120px;height:90px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.preview{max-width:220px;border-radius:8px;border:1px solid var(--line);display:block;margin-top:6px}
iframe.tool{width:100%;height:calc(100vh - 170px);min-height:600px;border:1px solid var(--line);border-radius:10px;background:#fff}
.overlay{position:fixed;inset:0;background:rgba(10,20,15,.45);display:flex;align-items:flex-start;justify-content:center;z-index:50;overflow:auto;padding:20px 10px}
.panel{background:#fff;border-radius:12px;max-width:720px;width:100%;padding:16px;box-shadow:0 10px 40px rgba(0,0,0,.2)}
.panel h2{margin:0 0 4px;font-size:18px}
.panel .foot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.signin{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lightbox img{max-width:95vw;max-height:90vh;border-radius:8px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media (max-width:760px){.two{grid-template-columns:1fr}.wrap{padding:10px}h1{font-size:18px}iframe.tool{height:calc(100vh - 200px)}}
.marketer .wrap{max-width:640px}
.photobtn{display:block;text-align:center;margin-top:4px}
.adpbox{background:#fff6e0;border:2px solid #f0c060;border-radius:10px;padding:10px 12px}
.adpbox .adpt{font-weight:700;font-size:15px;color:#7a4b00;margin-bottom:2px}
.appbtns{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0 4px}
.appbtn{display:inline-flex;align-items:center;gap:8px;background:#000;color:#fff;text-decoration:none;border-radius:9px;padding:6px 14px 6px 10px;min-height:44px;font-weight:600;font-size:16px;line-height:1.05;border:2px solid #000;opacity:.85}
.appbtn small{display:block;font-size:10px;font-weight:500;letter-spacing:.02em}
.appbtn .ai{font-size:20px;width:22px;text-align:center}
.appbtn.mine{opacity:1;box-shadow:0 0 0 3px #f0c060}
.btn.adpopen{display:block;text-align:center;text-decoration:none;margin:8px 0 0;background:#d0271d;border-color:#d0271d}
/* Phones: 16px text in fields stops iPhone Safari from zooming in; bigger tap targets for thumbs. */
@media (max-width:760px){
  input,select,textarea{font-size:16px!important}
  .chk{padding:9px 0;min-height:40px}
  .chk input{width:22px;height:22px}
  .btn.sm{padding:8px 12px;font-size:14px}
  .panel{padding:14px 12px}
  .overlay{padding:8px 6px}
}
.scopewrap{position:relative}

.scopereg{border-top:1px solid var(--line-soft);padding:6px 0}.scopereg>.chk{font-weight:600}.scopeoffs{padding-left:24px}.scopeoffs .chk{padding:2px 0;font-size:13px}
.scanrow{margin:6px 0}
svg.bc{max-width:100%;height:auto}

#cam video{width:100%;border-radius:8px;display:block;max-height:46vh;object-fit:cover}
#cam .row{color:#fff;margin-top:6px}
#printArea{display:none}
.exrow{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px;background:#fbfcfb}
table.extot{width:auto;min-width:280px;margin-top:8px}table.extot td,table.extot th{padding:4px 10px;border-bottom:1px solid var(--line-soft);text-transform:none;letter-spacing:0;font-size:13.5px;color:var(--ink)}table.extot td:last-child,table.extot th:last-child{text-align:right}
table.extab th{font-size:11px}table.meals{width:auto;margin:6px 0}table.meals td,table.meals th{text-align:center;padding:4px 10px}table.meals td:first-child{text-align:left}

.exdoc h3{margin:14px 0 4px}
@media print{
  body.printing-labels #app, body.printing-labels .overlay, body.printing-labels #cam, body.printing-labels #frames{display:none!important}
  body.printing-labels #printArea{display:block}
  body.printing-expense #app, body.printing-expense .overlay, body.printing-expense #cam, body.printing-expense #frames{display:none!important}
  body.printing-expense #printArea{display:block;font:11px Arial,sans-serif}
  body.printing-expense table{border-collapse:collapse;width:100%}body.printing-expense td,body.printing-expense th{border:1px solid #ccc;padding:3px 5px;font-size:10.5px}
  body.printing-expense .prcpt{max-width:240px;max-height:300px;display:block;margin:4px 0}
  @page{margin:0.5in 0.19in}
  .labels{display:grid;grid-template-columns:repeat(3,2.625in);grid-auto-rows:1in;column-gap:0.125in}
  .label{height:1in;padding:0.06in 0.1in;overflow:hidden;text-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;font:9px Arial,sans-serif}
  .label svg{height:0.55in;max-width:2.4in}.label .ln{font-weight:700;font-size:9px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:2.45in}.label .lt{font-size:7px;color:#555}
}
.notice.signal{background:#C8102E;color:#fff;border:2px solid #8B0A1F;font-weight:700;animation:sigflash 1.2s ease-in-out infinite}
.notice.signal a,.notice.signal b{color:#fff}
@keyframes sigflash{0%,100%{background:#C8102E;box-shadow:0 0 0 0 rgba(200,16,46,.6)}50%{background:#8B0A1F;box-shadow:0 0 0 6px rgba(200,16,46,0)}}
@media (prefers-reduced-motion:reduce){.notice.signal{animation:none}}

<body>
<div id="app"></div>
<div id="frames" class="wrap" style="display:none;padding-top:0"></div>
<div id="cam" hidden><video id="camVideo" playsinline muted></video><div class="row"><span id="camMsg" class="small" style="flex:1"></span><button class="btn sm" data-act="camStop">Done</button></div></div>
<div id="printArea"></div>
<script>
/* =====================================================================
   Patio Enclosures Event Hub
   One page for all event activity. Lives next to ETACC and the marketer
   schedule on GitHub Pages and uses the same Firebase project
   (Event Management Dashboard, event-management-dashboa-caf40).

   Reads:  patioEnclosuresSchedule/{events,roster,assignments,details}  (the schedule)
           dashboardEvents/*                                           (ETACC, signed-in managers)
   Writes: peHubCheckins/*   one doc per marketer shift (check-in + check-out)
           peHubPhotos/*     compressed booth photos
           peHubAssets/inventory   asset list (managers)
           peHubEvals/*      copy of each post-event evaluation (managers)
           dashboardEvents/{id}    the evaluation fields ETACC already has (managers)
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAcff37-OjCVKkY83HiSA3iwSkqYQOlxVQ",
  authDomain: "event-management-dashboa-caf40.firebaseapp.com",
  projectId: "event-management-dashboa-caf40",
  messagingSenderId: "1028378762774",
  appId: "1:1028378762774:web:65b77aa3527586a0be5f37"
};
const FB_VER = '10.12.2';
const SITE = 'https://patio-enclosures.github.io/Event-Tracking-Approval-Contracting-Center/';
const ETACC_URL = SITE, SCHEDULE_URL = SITE + 'schedule/';
const INCLUDE_STATUSES = ['Approved','Submitted for Contract'];
const LATE_MIN = 15;              // minutes after shift start before "Late"
// ADP stays the time clock: check-in/out reminds marketers to punch there too.
const ADP_URL = 'https://my.adp.com/';
// Event marketing leadership shown on the hub (phone numbers come from the roster when available).
const LEADERSHIP = [
  { name:'Paula Shoemaker', title:'National Events Manager', email:'paula.shoemaker@greatdayimprovements.com' },
  { name:'Trevor Morrissey', title:'Regional Event Marketing Manager', email:'trevor.morrissey@greatdayimprovements.com' },
  { name:'Angelique Critz', title:'Regional Event Marketing Manager', email:'angelique.critz@greatdayimprovements.com', alt:['Angelique Kritz'] },
  { name:'Chris Winston', title:'Regional Event Marketing Manager', email:'chris.winston@greatdayimprovements.com' },
];
function orgChartHtml(){
  return `<details class="orgchart"><summary>🗂️ Org chart: divisions & regions</summary><div class="orggrid">${ORG.map(d=>`<div class="orgdiv"><b>${esc(d.division)} Division</b><div class="small muted">${esc(d.leader.name)}</div><ul>${Object.entries(d.regions).map(([r,x])=>`<li>${esc(REGION_NAMES[r]||r)}: <a href="mailto:${esc(x.email)}">${esc(x.name)}</a></li>`).join('')}</ul></div>`).join('')}</div></details>`;
}
function leaderCard(){
  const find=l=>S.sched.roster.find(r=>[l.name,...(l.alt||[])].some(n=>normName(n)===normName(r.name)));
  const tel=p=>String(p||'').replace(/[^\d+]/g,'');
  return `<div class="card leaders"><h2>📞 Event marketing leadership</h2><div class="leadgrid">${LEADERSHIP.map(l=>{ const r=find(l)||{}; const ph=r.phone||l.phone||''; const title=r.title||l.title;
    return `<div class="lead"><div class="lav">${esc(l.name.split(' ').map(w=>w[0]).join(''))}</div><div><b>${esc(l.name)}</b><div class="small muted">${esc(title)}</div>
      <div class="small"><a href="mailto:${esc(r.email||l.email)}">${esc(r.email||l.email)}</a></div>${ph?`<div class="small"><a href="tel:${esc(tel(ph))}">${esc(ph)}</a></div>`:''}</div></div>`; }).join('')}</div>${orgChartHtml()}</div>`;
}
const TEAMS_HUB_URL = 'https://teams.microsoft.com/l/channel/19%3AhJ3v0SgRtUtuyqi5le9H55OLzeAo5DGdO0iSlKrS7x41%40thread.tacv2/Team%20Resource%20Hub?groupId=05ce58df-1a0a-486e-9825-6befb1c3c3dd&tenantId=213e780f-443e-4b07-98ea-c177eb740ffd';
// ADP Mobile Solutions app (official store listings, per ADP's "Getting Started" guide)
const ADP_APP_IOS = 'https://apps.apple.com/us/app/adp-mobile-solutions/id444553167';
const ADP_APP_ANDROID = 'https://play.google.com/store/apps/details?id=com.adpmobile.android';
const PHONE_OS = /iPhone|iPad|iPod/i.test(navigator.userAgent) || (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1) ? 'ios' : /Android/i.test(navigator.userAgent) ? 'android' : '';
function adpAppButtons(){
  // ADP doesn't publish a link that opens its app directly, so the button opens the ADP Mobile page in this
  // phone's app store, which shows "Open" when the app is installed (or "Get"/"Install" when it isn't).
  const ios=`<a class="appbtn ${PHONE_OS==='ios'?'mine':''}" href="${ADP_APP_IOS}" target="_blank" rel="noopener"><span class="ai">${PHONE_OS==='ios'?'\uF8FF':'📱'}</span><span><small>Download on the</small>App Store</span></a>`;
  const and=`<a class="appbtn ${PHONE_OS==='android'?'mine':''}" href="${ADP_APP_ANDROID}" target="_blank" rel="noopener"><span class="ai">▶</span><span><small>Get it on</small>Google Play</span></a>`;
  if(PHONE_OS){
    const url = PHONE_OS==='ios' ? ADP_APP_IOS : ADP_APP_ANDROID;
    return `<a class="btn big primary adpopen" href="${url}" target="_blank" rel="noopener">📲 Open the ADP app</a>
      <div class="small" style="margin:4px 0 2px">On the next screen, tap <b>Open</b>. If it says <b>${PHONE_OS==='ios'?'Get':'Install'}</b>, install it first and sign in with your ADP login.</div>
      <details class="small muted"><summary style="cursor:pointer">Other options</summary><div class="appbtns">${PHONE_OS==='android'?and+ios:ios+and}</div><a href="${ADP_URL}" target="_blank" rel="noopener">Use ADP on the web</a></details>`;
  }
  return `<div class="appbtns">${ios+and}</div><div class="small muted">Get the ADP Mobile app on your phone, or <a href="${ADP_URL}" target="_blank" rel="noopener">use ADP on the web</a>.</div>`;
}
function adpBox(kind, checked){
  const word = kind==='in' ? 'in' : 'out';
  return `<div class="adpbox"><div class="adpt">⏰ Clock ${word} on ADP</div>
    <div class="small">Your pay comes from ADP, not this check-${word}. Open the ADP app and clock ${word} now${kind==='out'?' (and record any meal break)':''}.</div>
    ${kind==='in'?`<div class="small" style="margin-top:4px"><b>Picking up equipment at the office?</b> Clock in on ADP when you <b>arrive at the office</b>, not at the booth. Your paid time runs from the office until you clock out at the end of your shift.</div>`:''}
    ${adpAppButtons()}
    <label class="chk"><input type="checkbox" data-keep="adp-${word}" ${checked?'checked':''}> <b>I’ve clocked ${word} on ADP</b></label></div>`;
}
const ISSUE_TYPES = ['Missing or damaged booth gear','Running low on giveaways / print','Booth location problem','Low foot traffic','Organizer / venue issue','Weather','Other'];
const EVAL_FIELDS = ['eventActivationStatus','notActivatedReason','numberOfLeads','totalAppointments','leadsPerHour','totalCallToSets','whoWorkedEvent','overallEventRating','staffComplianceRating','issuesEncountered','whatWentWell','notesForNextYear','roiNotes','actualLaborCost','actualPerDiem','actualPhoneCost','actualMileageCost','actualMiscExpenses'];

/* ---------------- state ---------------- */
const params = new URLSearchParams(location.search);
const MARKETER_MODE = params.has('m') || location.hash==='#checkin';
const DEMO = params.has('demo');
const EVENT_LINK = params.get('e') || '';   // per-event check-in link: ?m=1&e=<code>
const S = {
  mode:'connecting', err:'', user:null, authErr:'',
  sched:{ events:[], roster:[], assignments:{}, details:{} }, schedLoaded:false,
  checkins:{}, assets:[], assetsMeta:{}, evals:{}, alog:[], audits:{}, expenses:{}, mgr:{}, training:null,
  etacc:null, etaccErr:'',
};
const ui = {
  tab: MARKETER_MODE ? (['#training','#guide'].includes(location.hash)?location.hash.slice(1):'checkin') : (location.hash.replace('#','') || 'home'),
  scope: (()=>{ try{ return JSON.parse(lsGet('peHub.scope')||'[]'); }catch(e){ return []; } })(), scopeOpen:false, date: todayIso(),
  me: params.get('p') || lsGet('peHub.me') || '',
  panel:null, notice:'', noticeKind:'', busy:false, evalKey:null, evalDraft:null, detail:null,
  photoCache:{}, lightbox:null, assetForm:null, showOtherShift:false, av:'inventory', item:null, scanMsg:null, labelSel:[], station:null, audit:null, auditOffice:'', auditCond:'Good',
};
function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ v==null ? localStorage.removeItem(k) : localStorage.setItem(k,v); }catch(e){} }

/* ---------------- small helpers ---------------- */
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayIso(){ return isoOf(new Date()); }
function parseIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=parseIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function fmtLong(iso){ return iso ? parseIso(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}) : ''; }
function fmtMD(iso){ const d=parseIso(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function fmtTime(t){ const x=toMin(t); if(x===null) return ''; const h=Math.floor(x/60)%24, m=x%60; return `${((h+11)%12)+1}${m?':'+pad(m):''}${h>=12?'p':'a'}`; }
function timeRange(d){ return (d.start||d.stop) ? `${fmtTime(d.start)||'?'}–${fmtTime(d.stop)||'?'}` : 'Times TBD'; }
function fmtClock(ms){ return ms ? new Date(ms).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'}) : ''; }
function fmtStamp(ms){ return ms ? new Date(ms).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}) : ''; }
function nowMin(){ const d=new Date(); return d.getHours()*60+d.getMinutes(); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function uid(){ return Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4); }
function hash(s){ let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,0x01000193); } return (h>>>0).toString(36); }
function num(v){ const n=parseFloat(v); return isFinite(n)?n:0; }
function round1(n){ return Math.round(n*10)/10; }
function mapLink(loc){ return loc ? `https://www.google.com/maps?q=${loc.lat},${loc.lng}` : ''; }
function normName(s){ return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }

/* ---------------- schedule-derived data ---------------- */
function dayId(e,d){ return e.key+'#'+d.date; }
function checkinId(dId, personId){ return 'c_'+hash(dId)+'_'+hash(dId+'~'+personId); }
function person(id){ return S.sched.roster.find(r=>r.id===id); }
function personName(id){ const p=person(id); return p ? p.name : (Object.values(S.checkins).find(c=>c.personId===id)||{}).personName || 'Unknown'; }
function liveEvents(){ return S.sched.events.filter(e=>INCLUDE_STATUSES.includes(e.status)); }
function offices(){ const s=new Set(); S.sched.events.forEach(e=>e.office&&s.add(e.office)); S.sched.roster.forEach(r=>r.office&&s.add(r.office)); S.assets.forEach(a=>a.office&&s.add(a.office)); return [...s].sort(); }
// Region of each office comes from the ETACC Region column on its events.
function regionMap(){ const c={}; S.sched.events.forEach(e=>{ if(e.office&&e.region){ c[e.office]=c[e.office]||{}; c[e.office][e.region]=(c[e.office][e.region]||0)+1; } });
  const m={}; Object.entries(c).forEach(([o,r])=>{ m[o]=Object.entries(r).sort((a,b)=>b[1]-a[1])[0][0]; }); return m; }
function regionOf(o){ return regionMap()[o]||''; }
// Org chart: divisions → regions → regional manager. Emails are work emails (first.last@greatdayimprovements.com).
const REGION_NAMES = { SA:'South Atlantic', 'SA-2':'South Atlantic 2', NE:'Northeast', MAN:'Mid-Atlantic North', MAS:'Mid-Atlantic South', MW:'Midwest', UPL:'Upper Plains', 'MW-2':'Midwest 2', OV:'Ohio Valley', SC:'South Central', 'SC-2':'South Central 2', SW:'Southwest', PNW:'Pacific Northwest', SE:'Southeast' };
const ORG = [
  { division:'East', leader:{ name:'Trevor Morrissey', email:'trevor.morrissey@greatdayimprovements.com' }, regions:{ SA:{ name:'Trevor Morrissey', email:'trevor.morrissey@greatdayimprovements.com' }, 'SA-2':{ name:'Jessica Bustamante-Ripper', email:'jessica.bustamante-ripper@greatdayimprovements.com' }, NE:{ name:'Mike Wing', email:'michael.wing@greatdayimprovements.com' }, MAN:{ name:'Jarrett Branch', email:'jarrett.branch@greatdayimprovements.com' }, MAS:{ name:'Jarrett Branch', email:'jarrett.branch@greatdayimprovements.com' }, SE:{ name:'Kristy Riggins', email:'kristy.riggins@greatdayimprovements.com' } } },
  { division:'Central', leader:{ name:'Angelique Critz', email:'angelique.critz@greatdayimprovements.com' }, regions:{ MW:{ name:'Angelique Critz', email:'angelique.critz@greatdayimprovements.com' }, UPL:{ name:'Angelique Critz', email:'angelique.critz@greatdayimprovements.com' }, 'MW-2':{ name:'Eddie Wilson', email:'eddie.wilson@greatdayimprovements.com' }, OV:{ name:'Kortnee Brown', email:'kortnee.brown@greatdayimprovements.com' } } },
  { division:'West', leader:{ name:'Chris Winston', email:'chris.winston@greatdayimprovements.com' }, regions:{ SC:{ name:'Chris Winston', email:'chris.winston@greatdayimprovements.com' }, 'SC-2':{ name:'Stephen Novak', email:'stephen.novak@greatdayimprovements.com' }, SW:{ name:'Chris Winston', email:'chris.winston@greatdayimprovements.com' }, PNW:{ name:'Chris Winston', email:'chris.winston@greatdayimprovements.com' } } },
];
function regionName(r){ return REGION_NAMES[r] ? `${REGION_NAMES[r]} (${r})` : r; }
function divisionOf(r){ return ORG.find(d=>d.regions[r]) || null; }
function inOffice(o){ const sc=ui.scope||[]; if(!sc.length) return true; const r=regionOf(o), d=divisionOf(r); return sc.includes('o:'+o) || (!!r && sc.includes('r:'+r)) || (!!d && sc.includes('d:'+d.division)); }
function scopeLabel(){ const sc=ui.scope||[]; if(!sc.length) return 'All regions & offices'; const names=sc.map(x=>x.startsWith('d:')?x.slice(2)+' Division':x.startsWith('r:')?(REGION_NAMES[x.slice(2)]||x.slice(2))+' region':x.slice(2)); return names.length>3 ? names.slice(0,3).join(', ')+` +${names.length-3} more` : names.join(', '); }
function scopePicker(){
  const rm=regionMap(), regs=[...new Set(Object.values(rm))].sort(), sc=ui.scope||[];
  const offsFor=r=>offices().filter(o=>(rm[o]||'')===r);
  const noReg=offices().filter(o=>!rm[o]);
  const box=(tok,label,cls='')=>`<label class="chk ${cls}"><input type="checkbox" data-scope="${esc(tok)}" ${sc.includes(tok)?'checked':''}> ${esc(label)}</label>`;
  return `<div class="scopewrap"><button class="btn" data-act="scopeToggle">📍 ${esc(scopeLabel())} ▾</button>
    ${ui.scopeOpen?`<div class="scopepanel"><div class="row" style="margin-bottom:6px"><b>Show regions & offices</b><span class="spacer"></span><button class="btn sm" data-act="scopeClear">All</button><button class="btn sm primary" data-act="scopeToggle">Done</button></div>
      ${(()=>{ const reg=r=>`<div class="scopereg">${box('r:'+r, regionName(r)+' region (all offices)')}<div class="scopeoffs">${offsFor(r).map(o=>box('o:'+o,o)).join('')}</div></div>`;
        const inOrg=new Set(ORG.flatMap(d=>Object.keys(d.regions)));
        return ORG.map(d=>{ const rs=Object.keys(d.regions).filter(r=>regs.includes(r)); return `<div class="scopediv">${box('d:'+d.division, d.division+' Division ('+d.leader.name+')','divbox')}${rs.map(reg).join('')}</div>`; }).join('') + regs.filter(r=>!inOrg.has(r)).map(reg).join(''); })()}
      ${noReg.length?`<div class="scopereg"><div class="small muted">No region</div><div class="scopeoffs">${noReg.map(o=>box('o:'+o,o)).join('')}</div></div>`:''}</div>`:''}</div>`;
}
function rosterSorted(){ return S.sched.roster.slice().sort((a,b)=>a.name.localeCompare(b.name)); }
// Every scheduled person-shift on a date, merged with its check-in record.
function shiftsOn(date){
  const out=[];
  liveEvents().forEach(e=>e.days.forEach(d=>{
    if(d.date!==date) return;
    const id=dayId(e,d);
    (S.sched.assignments[id]||[]).forEach(pid=>out.push({ ev:e, day:personDay(id,d,pid), dayId:id, personId:pid, cid:checkinId(id,pid), c:S.checkins[checkinId(id,pid)]||null }));
  }));
  // Unscheduled check-ins (marketer filled in) for that date
  Object.values(S.checkins).forEach(c=>{
    if(c.date!==date || !c.unscheduled) return;
    const ev=S.sched.events.find(e=>e.key===c.eventKey) || { key:c.eventKey, name:c.eventName, office:c.office, venueName:c.venueName||'', days:[] };
    out.push({ ev, day:{date, start:c.shiftStart||'', stop:c.shiftStop||''}, dayId:c.dayId, personId:c.personId, cid:c.id, c, unscheduled:true });
  });
  return out.sort((a,b)=>(toMin(a.day.start)??9999)-(toMin(b.day.start)??9999) || a.ev.name.localeCompare(b.ev.name) || personName(a.personId).localeCompare(personName(b.personId)));
}
// A marketer's own hours that day (partial shift) or the event's hours.
function personDay(id,d,pid){ const o=((S.sched.shiftTimes||{})[id+'::'+pid]); return o&&(o.start||o.stop) ? Object.assign({}, d, { start:o.start||d.start, stop:o.stop||d.stop, partial:true }) : d; }
function shiftStatus(s){
  const c=s.c;
  if(c && c.status==='out') return { k:'out', label:`Checked out ${fmtClock(c.outAt)}`, cls:'p-green' };
  if(c && c.status==='in') {
    const ended = s.day.date<todayIso() || (s.day.date===todayIso() && toMin(s.day.stop)!==null && nowMin()>toMin(s.day.stop)+60);
    return ended ? { k:'noout', label:`No check-out (in ${fmtClock(c.inAt)})`, cls:'p-warn' } : { k:'in', label:`Checked in ${fmtClock(c.inAt)}`, cls:'p-blue' };
  }
  const st=toMin(s.day.start);
  if(s.day.date<todayIso() || (s.day.date===todayIso() && st!==null && nowMin()>st+LATE_MIN)) return { k:'late', label: s.day.date<todayIso()?'Never checked in':'Late – not checked in', cls:'p-red' };
  return { k:'pending', label:'Not checked in yet', cls:'p-gray' };
}
function hoursOf(c){ return (c && c.inAt && c.outAt && c.outAt>c.inAt) ? (c.outAt-c.inAt)/36e5 : 0; }

/* ---------------- assets ---------------- */
/* =====================================================================
   ASSETS: inventory, check-out / return, transfers, kits, barcodes,
   annual inventory count. Every movement is an entry in peHubAssetLog;
   an item's current status is rebuilt from those entries.
   ===================================================================== */
const ASSET_CATS = ['Tent','Table','Banner / sign','Display / sample','Flooring','Lighting','Tech','Kit','Giveaway','Print','Other'];
const CONDITIONS = ['Good','Fair','Needs repair','Damaged'];
const STATUS_LBL = { available:['Available','p-green'], out:['Checked out','p-blue'], repair:['In repair','p-warn'], lost:['Lost','p-red'] };
const JSB_URL = 'https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js';
const ZXING_URL = 'https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js';
const _scripts = {};
function loadScript(src){ return _scripts[src] || (_scripts[src] = new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=src; s.onload=res; s.onerror=()=>{ delete _scripts[src]; rej(new Error('Couldn’t load '+src)); }; document.head.appendChild(s); })); }

function assetById(id){ return S.assets.find(a=>a.id===id); }
function assetByCode(code){ const c=String(code||'').trim().toUpperCase(); return c ? S.assets.find(a=>!a.retired && String(a.code||'').trim().toUpperCase()===c) : null; }
function assetName(id){ const a=assetById(id); return a ? a.name+(a.code?` (${a.code})`:'') : 'Removed item'; }
function isGear(a){ return a && (a.kind==='gear' || a.kind==='kit'); }
function nextCode(){ let n=0; S.assets.forEach(a=>{ const m=String(a.code||'').match(/^PE-(\d+)$/i); if(m) n=Math.max(n,+m[1]); }); return 'PE-'+String(n+1).padStart(5,'0'); }
function kitOf(id){ return S.assets.find(k=>k.kind==='kit' && !k.retired && (k.contents||[]).includes(id)); }
function expandKits(ids){ const out=[]; ids.forEach(id=>{ if(!out.includes(id)) out.push(id); const a=assetById(id); if(a && a.kind==='kit') (a.contents||[]).forEach(c=>{ const x=assetById(c); if(x && !x.retired && !out.includes(c)) out.push(c); }); }); return out; }
function money(n){ return '$'+Math.round(num(n)).toLocaleString('en-US'); }

// Current state of every item, rebuilt from the log on each render.
let ST = {};
function computeStates(){
  const st={};
  S.assets.forEach(a=>{ st[a.id] = isGear(a) ? { status:'available', office:a.office||'', condition:a.condition||'Good', holder:null, audits:{} } : { qty:0, office:a.office||'', audits:{}, lastCount:0 }; });
  S.alog.slice().sort((x,y)=>(x.at||0)-(y.at||0)).forEach(e=>{
    const s=st[e.assetId]; if(!s) return; const gear='status' in s;
    switch(e.type){
      case 'checkout': if(gear){ s.status='out'; s.holder={ personId:e.personId||'', personName:e.personName||'', eventKey:e.eventKey||'', eventName:e.eventName||'', cid:e.cid||'', due:e.due||'', at:e.at, by:e.by||'' }; } break;
      case 'return': if(gear){ s.status = e.condition==='Missing' ? 'lost' : (e.condition==='Needs repair'||e.condition==='Damaged') ? 'repair' : 'available'; if(e.condition && e.condition!=='Missing') s.condition=e.condition; s.holder=null; } break;
      case 'status': if(gear){ s.status=e.status; if(e.status!=='out') s.holder=null; if(e.condition) s.condition=e.condition; } break;
      case 'transfer': s.office=e.toOffice||''; break;
      case 'use': if(!gear) s.qty-=num(e.qty); break;
      case 'restock': if(!gear) s.qty+=num(e.qty); break;
      case 'count': if(!gear){ s.qty=num(e.qty); s.lastCount=e.at; } break;
      case 'audit': s.audits[e.auditId]=e; s.lastSeen=e.at;
        if(gear){ if(e.condition) s.condition=e.condition; if(s.status==='lost') s.status='available'; }
        else if(e.qty!==undefined && e.qty!==''){ s.qty=num(e.qty); s.lastCount=e.at; }
        break;
    }
  });
  Object.values(st).forEach(s=>{ if(s.holder){ const c=s.holder.cid && S.checkins[s.holder.cid]; s.overdue = !!((c && (c.status==='out' || c.date<todayIso())) || (s.holder.due && s.holder.due<todayIso())); } });
  ST=st;
}
function stOf(a){ return (a && ST[a.id]) || {}; }
function assetInScope(a){ const o=stOf(a).office||a.office||''; return !o || inOffice(o); }
function scopedAssets(){ return S.assets.filter(a=>!a.retired && assetInScope(a)); }
function usedLast(a, days){ const cut=Date.now()-days*864e5; return S.alog.filter(e=>e.assetId===a.id && e.type==='use' && (e.at||0)>cut).reduce((t,e)=>t+num(e.qty),0); }
function isLow(a){ return a.kind==='consumable' && a.reorderAt!=='' && a.reorderAt!=null && stOf(a).qty<=num(a.reorderAt); }
function statusPill(a){ const s=stOf(a); if(!isGear(a)) return `<b>${s.qty}</b>${a.unit?' '+esc(a.unit):''} ${isLow(a)?'<span class="pill p-red">Reorder</span>':''}`;
  const [l,c]=STATUS_LBL[s.status]||['?','p-gray']; return `<span class="pill ${s.overdue?'p-red':c}">${s.overdue?'Overdue':l}</span>${s.holder?` <span class="small">${esc(s.holder.personName||'')}${s.holder.eventName?' · '+esc(s.holder.eventName):''}</span>`:''}`; }

async function logAsset(entries){
  const by=(S.user&&S.user.email)||'';
  entries=entries.map(e=>JSON.parse(JSON.stringify(Object.assign({ at:Date.now(), by }, e))));
  if(!entries.length) return;
  if(S.mode==='live'){ const {fsM,db}=DB.fb; for(let i=0;i<entries.length;i+=400){ const b=fsM.writeBatch(db); entries.slice(i,i+400).forEach(e=>b.set(fsM.doc(fsM.collection(db,'peHubAssetLog')), e)); await b.commit(); } }
  else { entries.forEach(e=>S.alog.push(Object.assign({ id:'l_'+uid() }, e))); localSave(); }
}
async function saveAudit(id, obj){
  if(S.mode==='live'){ const {fsM,db}=DB.fb; await fsM.setDoc(fsM.doc(db,'peHubAudits',id), JSON.parse(JSON.stringify(obj)), {merge:true}); }
  else { S.audits[id]=Object.assign({}, S.audits[id]||{}, obj); localSave(); }
}

/* ---------------- scanning (handheld scanner, typed code, or phone camera) ---------------- */
// A USB/Bluetooth scanner types the code and presses Enter into the focused scan box.
function scanBox(target, placeholder){
  return `<div class="row scanrow"><input type="text" data-scan="${target}" placeholder="${esc(placeholder||'Scan or type a barcode, then press Enter')}" autocomplete="off" autocapitalize="characters" style="flex:1;min-width:200px;font-size:16px;padding:9px">
    <button class="btn" data-act="camera" data-target="${target}">📷 Camera</button></div>`;
}
const cam = { reader:null, target:'', last:'', lastAt:0 };
async function startCamera(target){
  cam.target=target;
  const box=document.getElementById('cam'); box.hidden=false; document.getElementById('camMsg').textContent='Starting camera…';
  try{
    await loadScript(ZXING_URL);
    const hints=new Map(); hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS,[ZXing.BarcodeFormat.CODE_128,ZXing.BarcodeFormat.CODE_39,ZXing.BarcodeFormat.QR_CODE,ZXing.BarcodeFormat.EAN_13,ZXing.BarcodeFormat.UPC_A]);
    cam.reader=new ZXing.BrowserMultiFormatReader(hints);
    await cam.reader.decodeFromConstraints({ video:{ facingMode:'environment' } }, document.getElementById('camVideo'), (res)=>{
      if(!res) return; const code=res.getText(); const now=Date.now();
      if(code===cam.last && now-cam.lastAt<2500) return; cam.last=code; cam.lastAt=now;
      try{ navigator.vibrate && navigator.vibrate(60); }catch(e){}
      document.getElementById('camMsg').textContent='✓ '+code; onScan(cam.target, code);
    });
    document.getElementById('camMsg').textContent='Point the camera at a barcode.';
  }catch(e){ document.getElementById('camMsg').textContent='Camera unavailable: '+(e.message||e.name)+'. Type the code instead.'; }
}
function stopCamera(){ try{ cam.reader && cam.reader.reset(); }catch(e){} cam.reader=null; document.getElementById('cam').hidden=true; }

function onScan(target, raw){
  if(target==='audit' && ui.audit && S.audits[ui.audit] && S.audits[ui.audit].closedAt) return;
  const code=String(raw||'').trim(); if(!code) return;
  const a=assetByCode(code);
  const miss=()=>{ ui.scanMsg={kind:'err', text:`No item has the code “${code}”.`, code}; render(); };
  if(target==='lookup'){ if(!a) return miss(); ui.item=a.id; ui.scanMsg=null; render(); return; }
  if(target==='checkin'){ const p=ui.panel; if(!p) return; if(!a) return miss();
    if(!isGear(a)){ ui.scanMsg={kind:'err', text:`${a.name} is a giveaway/print item. Record what you use when you check out.`}; render(); return; }
    const s=stOf(a); if(s.status==='out' && s.holder && s.holder.personId!==p.pid){ ui.scanMsg={kind:'err', text:`${a.name} is checked out to ${s.holder.personName}. Ask your manager.`}; render(); return; }
    if(!p.gear.includes(a.id)) p.gear.push(a.id); ui.scanMsg={kind:'ok', text:`Added ${assetName(a.id)}.`}; render(); return; }
  if(target==='station'){ const t=ui.station; if(!a) return miss();
    if(!t.items.includes(a.id)) t.items.push(a.id); ui.scanMsg={kind:'ok', text:`Added ${assetName(a.id)}.`}; render(); return; }
  if(target==='audit'){ const au=S.audits[ui.audit]; if(!au || au.closedAt) return; if(!a) return miss();
    if(!isGear(a)){ ui.auditFocus=a.id; ui.scanMsg={kind:'ok', text:`${a.name}: enter the counted quantity below.`}; render(); return; }
    auditFound([a.id]); return; }
}
async function auditFound(ids){
  const au=S.audits[ui.audit]; const office=ui.auditOffice||'';
  const entries=[];
  ids.forEach(id=>{ const a=assetById(id); entries.push({ type:'audit', auditId:ui.audit, assetId:id, condition:ui.auditCond||'Good', office });
    const cur=stOf(a).office||a.office||''; if(office && cur!==office) entries.push({ type:'transfer', assetId:id, toOffice:office, note:`Found at ${office} during ${au.name}` }); });
  await guard(()=>logAsset(entries));
  ui.scanMsg={kind:'ok', text: ids.length===1 ? `✓ ${assetName(ids[0])} counted${office&&stOf(assetById(ids[0])).office!==office?'':''}.` : `✓ ${ids.length} items counted.`}; render();
}

    <h3>Booth gear & kits (${gear.length})</h3>

function stationView(){
  if(!S.user) return '<div class="card"><p class="muted">Sign in to check gear out, take returns or transfer items.</p></div>';

  const people=rosterSorted(), inS=people.filter(r=>!r.office||inOffice(r.office)), outS=people.filter(r=>r.office&&!inOffice(r.office));
  const rows=t.items.map(id=>{ const a=assetById(id); if(!a) return ''; const s=stOf(a);
    let warn='';
    if(t.mode==='checkout' && isGear(a) && s.status==='out') warn=`Already checked out to ${esc(s.holder.personName)}. Confirming moves it to the new person.`;
    if(t.mode==='checkout' && isGear(a) && (s.status==='repair'||s.status==='lost')) warn=`Marked ${STATUS_LBL[s.status][0].toLowerCase()}.`;

  if(kind==='consumable'){ rec.unit=g('unit'); rec.reorderAt=g('reorderAt')===''?'':num(g('reorderAt')); }
  if(kind==='kit') rec.contents=[...f.querySelectorAll('input[name=contents]:checked')].map(x=>x.value);
  const entries=[];
  let list;
  if(old){
    list=S.assets.map(x=>x.id===id?Object.assign({},x,rec):x);
    if(isGear(old) && g('condition') && g('condition')!==stOf(old).condition) entries.push({ type:'status', assetId:id, status:stOf(old).status, condition:g('condition'), note:'Condition updated' });
    if(rec.office!==old.office && rec.office!==stOf(old).office) entries.push({ type:'transfer', assetId:id, toOffice:rec.office, note:'Home office changed' });
  } else {
    const nid='a_'+uid(); list=[...S.assets, Object.assign({ id:nid, kind, createdAt:Date.now(), retired:false, condition:kind==='consumable'?undefined:g('condition') }, rec)];
    if(kind==='consumable') entries.push({ type:'count', assetId:nid, qty:num(g('qty')), note:'Starting quantity' });
  }
  await guard(async()=>{ await saveAssets(list); await logAsset(entries); });
  ui.assetForm=null; render();
}

/* =====================================================================
   EXPENSE REPORTS (replaces the GDI Expense Reimbursement Jotform)
   One report per marketer per week (Mon–Sun). Mileage GL 73200, per diem
   GL 73300, reimbursable expenses. Marketer submits; a manager approves
   or returns it. Approved totals feed post-event evaluation costs.
   Banking details are NOT collected here (see BANKING_FORM_URL).
   ===================================================================== */
const RATE_MARKETER = 0.76, RATE_MANAGER = 0.26;            // $/mile; managers (REM) have a car allowance
const PER_DIEM = { b:6, l:12, d:25 };                         // only on hotel dates
const MISC_CATS = ['Parking','Tolls','Fuel','Hotel (paid personally)','Event supplies','Booth cost','Shipping','Phone stipend','Other'];
const NO_RECEIPT_CATS = ['Phone stipend'];
const BANKING_FORM_URL = 'https://form.jotform.com/263027465665059';   // secure, encrypted banking-only Jotform (goes to Accounts Payable)
const ACCOUNTING_EMAIL = 'accountspayable@greatdayimprovements.com';   // approved reports are emailed here
const CERTIFY_TEXT = 'I confirm that the information provided above is accurate and truthful, that these expenses were incurred for company business, and that receipts are attached as required.';

function money2(n){ return '$'+(Math.round(num(n)*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function mondayOf(iso){ const d=parseIso(iso); const k=(d.getDay()+6)%7; d.setDate(d.getDate()-k); return isoOf(d); }
function datesBetween(a,b){ const out=[]; if(!a||!b||b<a) return out; for(let d=a; d<=b && out.length<31; d=addDays(d,1)) out.push(d); return out; }
function myExpIds(){ try{ return JSON.parse(lsGet('peHub.myExp')||'[]'); }catch(e){ return []; } }
function rememberExp(id){ const a=myExpIds(); if(!a.includes(id)){ a.push(id); lsSet('peHub.myExp', JSON.stringify(a.slice(-60))); } }
function expRate(p){ return p && p.mgr ? RATE_MANAGER : RATE_MARKETER; }
function getPath(o,p){ return p.split('.').reduce((x,k)=>x==null?x:x[k], o); }
function setPath(o,p,v){ const ks=p.split('.'); let x=o; ks.slice(0,-1).forEach(k=>{ if(x[k]==null) x[k]={}; x=x[k]; }); x[ks[ks.length-1]]=v; }

function expCalc(x){
  const totalMiles=(x.trips||[]).reduce((t,r)=>t+num(r.miles),0);
  const nonReimb=num(x.commuteDays)*num(x.commuteMiles);
  const eligible=Math.max(0,totalMiles-nonReimb);
  const mileage=Math.round(eligible*num(x.rate)*100)/100;
  let b=0,l=0,d=0,nights=0;
  (x.stays||[]).forEach(s=>{ nights+=Math.max(0,datesBetween(s.checkIn,s.checkOut).length-1); datesBetween(s.checkIn,s.checkOut).forEach(dt=>{ const m=(s.meals||{})[dt]||{}; if(m.b!==false) b++; if(m.l!==false) l++; if(m.d!==false) d++; }); });
  const perDiem=b*PER_DIEM.b+l*PER_DIEM.l+d*PER_DIEM.d;
  const misc=Math.round((x.misc||[]).reduce((t,r)=>t+num(r.amount),0)*100)/100;
  return { totalMiles, nonReimb, eligible, mileage, b, l, d, nights, perDiem, misc, total:Math.round((mileage+perDiem+misc)*100)/100 };
}
// Dollars per event from approved reports (mileage split by each trip's share of miles).
// Dollars by show/source code. Mileage is split by each trip's share of miles (after the commute deduction).
function expBySource(x){
  const c=expCalc(x), ratio=c.totalMiles ? c.mileage/c.totalMiles : 0, rows={};
  const codeFromEvent=k=>{ if(!k) return ''; const t=[...(x.trips||[]),...(x.stays||[])].find(r=>r.eventKey===k && r.showCode); return t?t.showCode:''; };
  const row=code=>{ const k=String(code||'').trim().toUpperCase()||'(no code)'; return rows[k]=rows[k]||{ code:k, mileage:0, perDiem:0, misc:0 }; };
  (x.trips||[]).forEach(t=>{ row(t.showCode||codeFromEvent(t.eventKey)).mileage+=num(t.miles)*ratio; });
  (x.stays||[]).forEach(s=>{ let a=0; datesBetween(s.checkIn,s.checkOut).forEach(dt=>{ const m=(s.meals||{})[dt]||{}; a+=(m.b!==false?PER_DIEM.b:0)+(m.l!==false?PER_DIEM.l:0)+(m.d!==false?PER_DIEM.d:0); }); row(s.showCode||codeFromEvent(s.eventKey)).perDiem+=a; });
  (x.misc||[]).forEach(r=>{ row(r.showCode||codeFromEvent(r.eventKey)).misc+=num(r.amount); });
  const list=Object.values(rows).map(r=>{ ['mileage','perDiem','misc'].forEach(k=>r[k]=Math.round(r[k]*100)/100); r.total=Math.round((r.mileage+r.perDiem+r.misc)*100)/100; return r; }).filter(r=>r.total).sort((a,b)=>a.code==='(no code)'?1:b.code==='(no code)'?-1:a.code.localeCompare(b.code));
  // fix any rounding penny so the codes add up to the report total
  const diff=Math.round((c.total-list.reduce((t,r)=>t+r.total,0))*100)/100; if(list.length && diff){ list[0].mileage=Math.round((list[0].mileage+diff)*100)/100; list[0].total=Math.round((list[0].total+diff)*100)/100; }
  return list;
}
function bySourceHtml(x){
  const list=expBySource(x); if(!list.length) return '';
  const t=k=>money2(list.reduce((s,r)=>s+r[k],0));
  return `<h3>Summary by show / source code</h3><table class="extab"><thead><tr><th>Show / source code</th><th style="text-align:right">Mileage (GL 73200)</th><th style="text-align:right">Per diem (GL 73300)</th><th style="text-align:right">Reimbursable</th><th style="text-align:right">Total</th></tr></thead><tbody>
    ${list.map(r=>`<tr><td><b>${esc(r.code)}</b></td><td style="text-align:right">${money2(r.mileage)}</td><td style="text-align:right">${money2(r.perDiem)}</td><td style="text-align:right">${money2(r.misc)}</td><td style="text-align:right"><b>${money2(r.total)}</b></td></tr>`).join('')}
    <tr><th>Total</th><th style="text-align:right">${t('mileage')}</th><th style="text-align:right">${t('perDiem')}</th><th style="text-align:right">${t('misc')}</th><th style="text-align:right">${t('total')}</th></tr></tbody></table>`;
}
function expenseCostsForEvent(e){
  const out={ mileage:0, perDiem:0, misc:0, phone:0, reports:0 };
  Object.values(S.expenses).filter(x=>x.status==='approved').forEach(x=>{
    const c=expCalc(x); let hit=false;
    const ratio=c.totalMiles ? c.mileage/c.totalMiles : 0;
    (x.trips||[]).forEach(r=>{ if(r.eventKey===e.key){ out.mileage+=num(r.miles)*ratio; hit=true; } });
    (x.stays||[]).forEach(s=>{ if(s.eventKey===e.key){ datesBetween(s.checkIn,s.checkOut).forEach(dt=>{ const m=(s.meals||{})[dt]||{}; out.perDiem+=(m.b!==false?PER_DIEM.b:0)+(m.l!==false?PER_DIEM.l:0)+(m.d!==false?PER_DIEM.d:0); }); hit=true; } });
    (x.misc||[]).forEach(r=>{ if(r.eventKey===e.key){ if(r.category==='Phone stipend') out.phone+=num(r.amount); else out.misc+=num(r.amount); hit=true; } });
    if(hit) out.reports++;
  });
  ['mileage','perDiem','misc','phone'].forEach(k=>out[k]=Math.round(out[k]*100)/100);
  return out;
}

async function saveExpense(x){
  x.updatedAt=Date.now(); x.totals=expCalc(x);
  const clean=JSON.parse(JSON.stringify(x));
  if(S.mode==='live'){ const {fsM,db}=DB.fb; await fsM.setDoc(fsM.doc(db,'peHubExpenses',x.id), clean); }
  else { S.expenses[x.id]=clean; localSave(); }
  S.expenses[x.id]=clean; rememberExp(x.id);
}
function watchMyExpenses(){

function newExpense(pid){

function venueText(e){ return [e.venueName, e.venueAddress].filter(Boolean).join(', '); }
// Commute days = days the marketer went to the office first (equipment pickup); home→venue days get full mileage.
// Policy: deduct the round-trip home↔office commute on every event day, whether they went to the office first or drove from home.
function syncCommuteDays(x){ x.commuteDays=String(new Set((x.trips||[]).filter(t=>t.date).map(t=>t.date)).size); }
function weekShiftsFor(x){ const out=[]; datesBetween(x.weekStart,x.weekEnd).forEach(d=>shiftsOn(d).filter(s=>s.personId===x.personId).forEach(s=>out.push(s))); return out; }
function prefillTrips(x){
  if((x.trips||[]).length) return;
  const seen=new Set();
  x.trips=weekShiftsFor(x).filter(s=>{ const k=s.day.date+'|'+s.ev.key; if(seen.has(k)) return false; seen.add(k); return true; })
    .map(s=>({ id:uid(), date:s.day.date, eventKey:s.ev.key, eventName:s.ev.name, showCode:'', from:'Home', to:venueText(s.ev), officeFirst:!!(S.checkins[s.cid]||{}).officePickup, miles:'' }));
  syncCommuteDays(x);
}
function expEventOptions(x, sel){
  const evs=[], seen=new Set(); weekShiftsFor(x).forEach(s=>{ if(!seen.has(s.ev.key)){ seen.add(s.ev.key); evs.push(s.ev); } });
  liveEvents().filter(e=>e.days.some(d=>d.date>=x.weekStart&&d.date<=x.weekEnd) && !seen.has(e.key) && (!x.office || e.office===x.office)).forEach(e=>{ seen.add(e.key); evs.push(e); });
  return `<option value="">Event…</option>${evs.map(e=>`<option value="${esc(e.key)}" ${e.key===sel?'selected':''}>${esc(e.name)}</option>`).join('')}<option value="__other" ${sel==='__other'?'selected':''}>Other / not listed</option>`;
}

function expValidate(x){
  const c=expCalc(x), errs=[];
  if(!x.email) errs.push('your email'); if(!x.supervisor) errs.push('your supervisor'); if(!x.eventMgrEmail) errs.push('the event manager’s email');
  if(x.method==='check'){ const a=x.address||{}; if(!a.street||!a.city||!a.state||!a.zip) errs.push('your full mailing address'); }
  if(!(x.trips||[]).length && !(x.stays||[]).length && !(x.misc||[]).length) errs.push('at least one trip, hotel stay or expense');
  (x.trips||[]).forEach((t,i)=>{ if(!t.date||!num(t.miles)) errs.push(`date and miles for trip ${i+1}`); if(!t.showCode) errs.push(`show code for trip ${i+1}`); });
  if((x.trips||[]).length && x.commuteDays==='') errs.push('number of commute days');
  (x.stays||[]).forEach((s,i)=>{ if(!s.checkIn||!s.checkOut||s.checkOut<s.checkIn) errs.push(`hotel dates for stay ${i+1}`); if(!s.showCode) errs.push(`show code for stay ${i+1}`); if(!s.receipt) errs.push(`hotel receipt for stay ${i+1}`); });

  if(!x.certify) errs.push('the certification checkbox'); if(!x.signature) errs.push('your signature');

}

const ADP_MANAGER_URL = 'https://workforcenow.adp.com/';   // where managers approve timecards
// Every scheduled or checked-in shift in a Mon–Sun pay week, with what to compare against ADP.
function adpRows(wk){
  const out=[];
  datesBetween(wk, addDays(wk,6)).forEach(d=>shiftsOn(d).filter(s=>inOffice(s.ev.office)).forEach(s=>{
    const c=s.c, st=shiftStatus(s);
    const issues=[];
    if(d<=todayIso()){
      if(!c && (d<todayIso() || st.k==='late')) issues.push('No check-in');
      if(c && !c.adpIn) issues.push('ADP clock-in not confirmed');
      if(c && c.status==='out' && !c.adpOut) issues.push('ADP clock-out not confirmed');
      if(c && c.status==='in' && (d<todayIso())) issues.push('Never checked out');
    }
    out.push({ s, c, d, issues, flag:issues.length>0 });
  }));
  return out.sort((a,b)=>personName(a.s.personId).localeCompare(personName(b.s.personId)) || a.d.localeCompare(b.d));
}

const NAVAN_URL = 'https://app.navan.com/';
// Upcoming events (next 30 days) that likely need hotel rooms: ETACC planned hotel nights, or marketers borrowed from another office.
function travelNeeds(){
  const t=todayIso(), lim=addDays(t,30);
  return liveEvents().filter(e=>inOffice(e.office) && (e.end||e.start)>=t && e.start<=lim).map(e=>{
    const m=etaccMatch(e), hotelNights=m?num(m.hotelNights):0, travelDays=m?num(m.travelDays):0;
    const days=e.days.filter(d=>d.date>=t).map(d=>({ d, people:(S.sched.assignments[dayId(e,d)]||[]).map(person).filter(Boolean) }));
    const borrowed=[...new Map(days.flatMap(x=>x.people).filter(p=>p.office && p.office!==e.office).map(p=>[p.id,p])).values()];
    return { e, m, hotelNights, travelDays, days, borrowed };
  }).filter(x=>x.hotelNights>0 || x.borrowed.length).sort((a,b)=>a.e.start.localeCompare(b.e.start));
}
function travelView(){
  const list=travelNeeds();
  return `<div class="row" style="margin-bottom:12px"><a class="btn primary big" style="width:auto;text-decoration:none" href="${NAVAN_URL}" target="_blank" rel="noopener">🏨 Open Navan ↗</a><span class="spacer"></span>${scopePicker()}</div>

function evalFor(e){ const saved=S.evals[evalKey(e)], m=etaccMatch(e); return Object.assign({}, m||{}, saved?saved.fields:{}); }
function activationData(from, to){
  const t=todayIso();
  const evs=liveEvents().filter(e=>inOffice(e.office) && e.days.some(d=>d.date>=from && d.date<=to && d.date<=t)).sort((a,b)=>a.start.localeCompare(b.start)||a.name.localeCompare(b.name));
  return evs.map(e=>{
    const r=rollup(e), ev=evalFor(e);
    const inRange=r.cs.filter(c=>c.date>=from && c.date<=to);
    const done=inRange.filter(c=>c.status==='out');
    const leads=done.reduce((s,c)=>s+num(c.leads),0), appts=done.reduce((s,c)=>s+num(c.appts),0), hrs=done.reduce((s,c)=>s+hoursOf(c),0);
    const scheduled=e.days.filter(d=>d.date>=from&&d.date<=to).reduce((n,d)=>n+(S.sched.assignments[dayId(e,d)]||[]).length,0);
    let status=ev.eventActivationStatus||'', reason=ev.notActivatedReason||'';
    if(!status) status = inRange.length ? 'Activated' : 'Not Activated';
    const inferred = !ev.eventActivationStatus;
    if(status!=='Activated' && !reason) reason = inRange.length ? '' : (scheduled ? 'No check-ins recorded. Reason needed (complete the evaluation).' : 'No marketers scheduled and no check-ins. Reason needed.');
    return { e, ev, status, inferred, reason, leads, appts, hrs, scheduled, cs:inRange, done,
      names:[...new Set(inRange.map(c=>c.personName))], issues:inRange.filter(c=>(c.issues||[]).length||c.issueText).map(c=>`${c.personName}: ${[...(c.issues||[]),c.issueText].filter(Boolean).join('; ')}`),
      notes:done.filter(c=>c.notes).map(c=>`${c.personName}: ${c.notes}`), traffic:[...new Set(done.map(c=>c.traffic).filter(Boolean))].join(', ') };
  });
}

function defaultRegionMgrs(){ const m={}; ORG.forEach(d=>Object.entries(d.regions).forEach(([r,x])=>{ m[r]=x.email; })); return m; }
function alertCfg(){ const c=S.alertCfg || { offices:{}, allowed:[] }; return Object.assign({ ccDivision:true }, c, { regions:Object.assign(defaultRegionMgrs(), c.regions||{}), offices:c.offices||{} }); }
function cleanList(a){ return [...new Set(a.map(x=>String(x||'').trim().toLowerCase()).filter(x=>/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(x)))]; }
function splitEmails(v){ return cleanList(String(v||'').split(/[;,\s]+/)); }

function alertRecipients(office){
  const c=alertCfg(), sup=splitEmails(c.offices[office]), rm=splitEmails(c.regions[regionOf(office)]);

async function queueMail(id, src){
  const mail={ to:cleanList(src.to||[]), cc:cleanList(src.cc||[]), message:{ subject:src.subject, html:src.html }, kind:src.kind||'', createdAt:Date.now() };

  try{ await withSignal(fsM.setDoc(fsM.doc(db,'peHubAlerts',id), alert)); }catch(e){ if(e.code==='permission-denied') return false; console.warn('alert',id,e); }

async function sweepAlerts(){
  if(S.mode!=='live' || !S.user || !S.isMgr || !S.schedLoaded || previewing()) return;
  const t=todayIso();
  for(const s of shiftsOn(t)){
    const k=shiftStatus(s).k, ev=s.ev;
    const c=s.c || { id:s.cid, personName:personName(s.personId), eventName:ev.name, office:ev.office, venueName:ev.venueName, date:s.day.date, shiftStart:s.day.start, shiftStop:s.day.stop };
    if(k==='late' && toMin(s.day.start)!==null && nowMin()>toMin(s.day.start)+30){
      const r=alertRecipients(ev.office);
      await queueMail('noshow-'+s.cid, { ...r, office:ev.office, kind:'noshow', subject:`Not checked in: ${c.personName} at ${ev.name}`,
        html:mailShell('Marketer hasn’t checked in', `<p>${esc(c.personName)} was scheduled to start at <b>${esc(fmt12(s.day.start))}</b> and hasn’t checked in yet.</p>`+shiftTable(c)) });
    }
    if(k==='noout'){
      const r=alertRecipients(ev.office);
      await queueMail('noout-'+s.cid, { ...r, office:ev.office, kind:'noout', subject:`No check-out: ${c.personName} at ${ev.name}`,
        html:mailShell('Shift ended without a check-out', `<p>${esc(c.personName)} checked in at ${fmtClock(c.inAt)} but hasn’t checked out, and the shift ended at <b>${esc(fmt12(s.day.stop))}</b>. Results and equipment status are missing.</p>`+shiftTable(c)) });
    }
  }
  try{ await remReminderSweep(); }catch(e){ console.warn('rem reminder',e); }
  try{ await asgOverdueSweep(); }catch(e){ console.warn('task reminders',e); }
  // Weekly activation summary: Monday 8 am, covering last Monday–Sunday, all regions.
  const now=new Date();
  if(now.getDay()===SUMMARY_SEND.dow && now.getHours()>=SUMMARY_SEND.hour && S.etacc!==null && S.evalsLoaded){
    const mon=mondayOf(t), from=addDays(mon,-7), to=addDays(mon,-1), keep=ui.scope; ui.scope=[];
    try{ await queueMail('summary-'+mon, { to:SUMMARY_TO, kind:'summary', subject:summarySubject(from,to), html:summaryHtml(from,to,true), text:'Last week’s event activation summary and cost per lead are ready.' }); } finally { ui.scope=keep; }
  }
}

async function saveAlertCfg(vals){
  const c=JSON.parse(JSON.stringify(alertCfg())); c.regions=c.regions||{}; c.offices=c.offices||{};
  (vals||[]).forEach(el=>{ const v=splitEmails(el.value).join(', '); c.teams=c.teams||{}; const m=el.kind==='region'?c.regions:el.kind==='teams'?c.teams:c.offices; if(v) m[el.key]=v; else delete m[el.key]; });
  if(vals && vals.ccDivision!==undefined) c.ccDivision=vals.ccDivision;
  c.allowed=cleanList([...LEADS, ...SUMMARY_TO, ...ORG.map(d=>d.leader.email), ...Object.values(c.regions).flatMap(splitEmails), ...Object.values(c.offices).flatMap(splitEmails), ...Object.values(c.teams||{}).flatMap(splitEmails)]);
  c.updatedAt=Date.now(); c.updatedBy=(S.user&&S.user.email)||'';
  if(S.mode==='live'){ const {fsM,db}=DB.fb; await fsM.setDoc(fsM.doc(db,'peHubSettings','alerts'), c); }
  S.alertCfg=c; if(S.mode!=='live') localSave();
}

// --- bad signal: writes are kept on the phone and sent when signal returns ---
let SIGNAL_WAIT_MS = 9000;
function withSignal(p){
  return Promise.race([p, new Promise(res=>setTimeout(()=>{ ui.queued=true; res('queued'); }, SIGNAL_WAIT_MS))]);
}
function offlineBanner(){
  if(navigator.onLine && !ui.queued) return '';
  return `<div class="notice signal" role="alert">📶 ${navigator.onLine?'Weak signal: what you saved is stored on this phone and will send automatically when the signal improves. Keep this page open, or open it again later.':'You’re offline. You can still check in and out: it’s saved on this phone and sends automatically when you have signal again.'}
    ${ui.lastSms?`<div style="margin-top:6px"><a class="btn sm" href="sms:?&body=${encodeURIComponent(ui.lastSms)}">💬 Backup: text my manager</a></div>`:''}</div>`;
}
window.addEventListener('online', ()=>{ setTimeout(()=>{ ui.queued=false; render(); }, 6000); render(); });
window.addEventListener('offline', ()=>render());

/* ---------------- Assigned tasks & sprints (Paula, Trevor, Angelique, Chris assign; managers complete) ----------------
   peHubTasks/{id}: { title, note, link, required, kind:'day'|'week'|'sprint', steps:[{id,text,due,scope}], audience, assignees:[emails],
                      createdBy, createdByName, createdAt, archived }
   peHubTaskDone/{taskId__stepId__mgrKey}: { taskId, stepId, email, at, note }                                        */
const ASG_KINDS = { day:'One-off task (a day)', week:'Task for a week', sprint:'Sprint (several steps)' };
const OVERDUE_MAIL_HOUR = 8;   // overdue reminder goes the morning after the due date, from 8 am
function emKey(e){ return String(e||'').toLowerCase().replace(/[^a-z0-9]+/g,'_'); }
function myEmail(){ return String((S.user&&S.user.email)||'').toLowerCase(); }
function asgTasks(){ return Object.values(S.asg||{}).filter(t=>!t.archived); }
function asgDoneRec(tid, sid, email){ return (S.asgDone||{})[`${tid}__${sid}__${emKey(email)}`]; }
function stepWeekEnd(st){ return addDays(mondayOf(st.due),6); }
function stepLate(st, t){ return st.scope==='week' ? stepWeekEnd(st)<t : st.due<t; }
function asgByName(t){ return (t.createdByName||'').split(' ')[0] || 'leadership'; }

var viewAsUnsub=null;
function realEmail(){ return String(((S.realUser||S.user)||{}).email||'').toLowerCase(); }
function previewing(){ return !!(S.user && S.user.preview); }
function canViewAs(){ return !MARKETER_MODE && !!(S.realUser||S.user) && (LEADS.includes(realEmail()) || DEMO); }

  if(S.mode==='live' && DB.raw){ const {fsM,db}=DB.raw, mk=mgrKey(); viewAsUnsub=fsM.onSnapshot(fsM.doc(db,'peHubMgr',mk), snap=>{ if(snap.exists()){ S.mgr[mk]=mgrFromFs(snap.data()); render(); } }, err=>console.warn('view-as',err)); }

function endViewAs(){

  if(S.realUser){ S.user=S.realUser; S.realUser=null; ui.scope=S.realScope||[]; S.realScope=null; }
  Object.assign(ui,{ tab:'home', tour:null, rem:null, item:null, detail:null, exp:null, expView:null, audit:null, notice:'' });

function previewBlocked(){ ui.notice='Preview only: nothing was saved. Exit the preview to make changes.'; ui.noticeKind='warn'; render(); return Promise.reject(new Error('preview-only')); }
function guardWrites(fsM){
  const g=Object.assign({}, fsM);
  ['setDoc','updateDoc','deleteDoc','addDoc'].forEach(k=>{ const f=fsM[k]; g[k]=(...a)=>previewing()?previewBlocked():f(...a); });
  const wb=fsM.writeBatch; g.writeBatch=(...a)=>{ const b=wb(...a); if(!previewing()) return b; return { set(){return this;}, update(){return this;}, delete(){return this;}, commit:()=>previewBlocked() }; };
  return g;
}
function asgPeople(){
  const m={}, add=(email,name,region)=>{ email=String(email||'').trim().toLowerCase(); if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return; const x=m[email]=m[email]||{ email, name:'', regions:new Set() }; if(name&&!x.name) x.name=name; if(region) x.regions.add(region); };
  LEADERSHIP.forEach(p=>add(p.email,p.name));
  ORG.forEach(d=>{ Object.entries(d.regions).forEach(([r,x])=>{ add(x.email,x.name,r); add(d.leader.email,d.leader.name,r); }); });
  const c=alertCfg(); Object.entries(c.offices||{}).forEach(([o,v])=>splitEmails(v).forEach(e=>add(e,'',regionOf(o))));
  (S.sched.roster||[]).forEach(p=>{ if(p.email && (p.mgr || m[String(p.email).toLowerCase()])) add(p.email,p.name,regionOf(p.office)); });
  return Object.values(m).map(x=>Object.assign(x,{ name:x.name||x.email.split('@')[0].replace(/[._]/g,' ').replace(/\b\w/g,c=>c.toUpperCase()) })).sort((a,b)=>a.name.localeCompare(b.name));
}
function asgResolve(a){
  const P=asgPeople();
  if(a.mode==='all') return P.map(p=>p.email);
  if(a.mode==='division'){ const d=ORG.find(x=>x.division===a.value); if(!d) return []; const rs=Object.keys(d.regions); return P.filter(p=>[...p.regions].some(r=>rs.includes(r)) || p.email===d.leader.email.toLowerCase()).map(p=>p.email); }
  if(a.mode==='region') return P.filter(p=>p.regions.has(a.value)).map(p=>p.email);
  return cleanList(a.people||[]);
}
function asgAudienceLabel(a){ return a.mode==='all'?'Everyone':a.mode==='division'?`${a.value} Division`:a.mode==='region'?regionName(a.value):`${(a.people||[]).length} people`; }

/* ----- what a manager sees ----- */
function asgMine(){ const me=myEmail(); return asgTasks().filter(t=>(t.assignees||[]).includes(me)); }
function asgItems(scope, key){
  const me=myEmail(), t=todayIso(), out=[];
  asgMine().forEach(task=>(task.steps||[]).forEach(st=>{
    const done=!!asgDoneRec(task.id, st.id, me);
    let show=false, late=false;

/* =====================================================================
   COST PER LEAD: what each event cost vs. the leads and opps it
   produced. Costs: booth/contract fee (ETACC), marketer wages, mileage,
   per diem, phone and misc (approved expense reports or the evaluation's
   actual costs), and hotel nights (ETACC estimate).
   Pay rates live in peHubRates/main: managers can read, Paula/Trevor edit.
   ===================================================================== */
const DEFAULT_PAY = 23;          // $/hour, same as ETACC's labor rate
const HOTEL_EST = 175;           // $/night, same as ETACC
const DEFAULT_CPA_TARGET = 350;  // cost per appointment target (ETACC "cost per opp")
const DEFAULT_CPL_TARGET = 120;  // cost per lead target
function ratesDoc(){ return S.rates || { default:DEFAULT_PAY, rates:{}, cpaTarget:DEFAULT_CPA_TARGET, cplTarget:DEFAULT_CPL_TARGET }; }
function rateKey(p){ return p && p.empId ? 'id:'+String(p.empId).trim() : 'n:'+normName(p&&p.name); }
function payRate(personId, name){ const p=person(personId)||{ name }, r=ratesDoc(); const v=(r.rates||{})[rateKey(p)]; return v!==undefined&&v!==''?num(v):num(r.default||DEFAULT_PAY); }
// Paid hours: from the office ADP clock-in (equipment pickup) or check-in, to check-out.
function paidHours(c){
  if(!(c && c.inAt && c.outAt)) return 0;
  let start=c.inAt;
  if(c.officePickup && c.officeClockIn){ const m=toMin(c.officeClockIn), d=new Date(c.inAt); if(m!==null){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate(),Math.floor(m/60),m%60).getTime(); if(t<c.inAt && c.inAt-t<6*36e5) start=t; } }
  return Math.max(0,(c.outAt-start)/36e5);
}
function eventCost(e, from, to){
  const ev=evalFor(e), m=etaccMatch(e)||{}, r=rollup(e), xc=expenseCostsForEvent(e);
  const cs=r.cs.filter(c=>(!from||c.date>=from)&&(!to||c.date<=to)), done=cs.filter(c=>c.status==='out');
  const est={};
  const pick=(actual, fallback, k)=>{ const a=num(actual); if(String(actual??'').trim()!=='' && a>0) return a; if(fallback>0) est[k]=true; return fallback; };
  const laborCalc=done.reduce((t,c)=>t+paidHours(c)*payRate(c.personId,c.personName),0);
  const cost={
    fee: num(m.contractCost)+num(m.miscCosts),
    labor: pick(ev.actualLaborCost, laborCalc, 'labor'),
    mileage: pick(ev.actualMileageCost, xc.mileage, 'mileage'),
    perDiem: pick(ev.actualPerDiem, xc.perDiem, 'perDiem'),
    phone: pick(ev.actualPhoneCost, xc.phone, 'phone'),
    misc: pick(ev.actualMiscExpenses, xc.misc, 'misc'),
    hotel: num(m.hotelNights)*HOTEL_EST,
  };
  if(cost.hotel) est.hotel=true;
  // labor computed from check-outs and expenses from approved reports are "actual" data; only hotel is a true estimate
  delete est.mileage; delete est.perDiem; delete est.phone; delete est.misc;
  const total=Object.values(cost).reduce((a,b)=>a+b,0);
  const leads=done.length?done.reduce((t,c)=>t+num(c.leads),0):num(ev.numberOfLeads);
  const appts=done.length?done.reduce((t,c)=>t+num(c.appts),0):num(ev.totalAppointments);
  const hrs=done.reduce((t,c)=>t+paidHours(c),0);
  return { e, cost, total:Math.round(total*100)/100, leads, appts, hrs, est, noFee:!m.contractCost && !m.id, cpl:leads?total/leads:null, cpa:appts?total/appts:null, pendingReports:Object.values(S.expenses).some(x=>['submitted','returned','draft'].includes(x.status)&&[...(x.trips||[]),...(x.stays||[]),...(x.misc||[])].some(y=>y.eventKey===e.key)) };
}
function costRows(from, to){
  const t=todayIso();
  return liveEvents().filter(e=>inOffice(e.office) && e.days.some(d=>d.date>=from && d.date<=to && d.date<=t))
    .map(e=>eventCost(e,from,to)).filter(x=>x.total>0||x.leads>0)

async function loadXlsxLib(){ if(!window.XLSX) await new Promise((res,rej)=>{ const sc=document.createElement('script'); sc.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; sc.onload=res; sc.onerror=()=>rej(new Error('Couldn’t load the Excel reader. Check your connection.')); document.head.appendChild(sc); }); }

  const raw=XLSX.utils.sheet_to_json(wb.Sheets[name],{defval:''}); if(!raw.length) throw new Error('That sheet is empty.');

}

// Jotform "Event Marketing Weekly Numbers" export → peHubScorecard
async function importRemJotform(file){

  const C={ name:col(/your\s*name/i), period:col(/reporting\s*period/i), week:col(/week\s*starting/i), month:col(/^month/i), region:col(/^region/i), cancels:col(/cancels/i), meets:col(/meets/i), labor:col(/labor/i), expenses:col(/expenses/i), sales:col(/sales/i), date:col(/submission\s*date|created/i) };

  const sorted=raw.slice().sort((a,b)=>String(a[C.date]||'').localeCompare(String(b[C.date]||'')));  // later submissions replace earlier ones
  let n=0; const bad=[]; S.scManual=S.scManual||{}; const writes={};
  sorted.forEach(r=>{ const reg=codeOf(r[C.region]); if(!reg){ bad.push(String(r[C.region])); return; }
    const isMonth=/month/i.test(String(C.period?r[C.period]:'')) || (!scDateCell(C.week?r[C.week]:'') && scDateCell(C.month?r[C.month]:''));
    const v=x=>String(x??'').trim()===''?'':scNum(x);
    if(isMonth){ const d=scDateCell(r[C.month]); if(!d) return; const id=`m_${d.slice(0,7)}_${reg}`; writes[id]={ sales:v(r[C.sales]), region:reg, period:'month', key:d.slice(0,7), updatedAt:Date.now(), updatedBy:String(r[C.name]||'Jotform import') }; }
    else { const d=scDateCell(r[C.week]); if(!d) return; const w=mondayOf(d), id=`w_${w}_${reg}`; writes[id]={ cancels:v(r[C.cancels]), meets:v(r[C.meets]), labor:v(r[C.labor]), expenses:v(r[C.expenses]), region:reg, period:'week', key:w, updatedAt:Date.now(), updatedBy:String(r[C.name]||'Jotform import') }; }

}

/* ---------------- evaluations ---------------- */
function eventCode(e){ return hash(e.key); }
function checkinLink(e){ return location.origin+location.pathname+'?m=1&e='+eventCode(e); }
function linkedEvent(){ return EVENT_LINK ? S.sched.events.find(e=>eventCode(e)===EVENT_LINK) : null; }
function evalKey(e){ return 'e_'+hash(e.key); }
function etaccMatch(e){
  if(!S.etacc) return null;
  const n=normName(e.name);
  return S.etacc.find(x=>normName(x.eventName)===n && x.startDate===e.start) || S.etacc.find(x=>normName(x.eventName)===n && x.startDate && Math.abs(parseIso(x.startDate)-parseIso(e.start))<=3*864e5) || null;
}
function eventCheckins(e){ return Object.values(S.checkins).filter(c=>c.eventKey===e.key); }
function evalDone(e){ const m=etaccMatch(e); return !!(S.evals[evalKey(e)] || (m && m.postEventEvalCompleted)); }
function evalsDue(){
  const today=todayIso(), cut=addDays(today,-45);
  return liveEvents().filter(e=>(e.end||e.start)<today && (e.end||e.start)>=cut && inOffice(e.office));
}
function rollup(e){
  const cs=eventCheckins(e), done=cs.filter(c=>c.status==='out');
  const leads=done.reduce((t,c)=>t+num(c.leads),0), appts=done.reduce((t,c)=>t+num(c.appts),0);
  const hrs=done.reduce((t,c)=>t+hoursOf(c),0);
  const names=[...new Set(cs.map(c=>c.personName||personName(c.personId)))];
  const issues=cs.filter(c=>(c.issues||[]).length||c.issueText).map(c=>`${fmtMD(c.date)} ${c.personName}: ${[...(c.issues||[]),c.issueText].filter(Boolean).join('; ')}`);
  const notes=done.filter(c=>c.notes).map(c=>`${fmtMD(c.date)} ${c.personName}: ${c.notes}`);
  return { cs, done, leads, appts, hrs, names, issues, notes, lph: hrs ? round1(leads/hrs) : 0 };
}

function getLocation(){
  return new Promise(res=>{
    if(!navigator.geolocation) return res({ loc:null, note:'This device can’t share location.' });
    navigator.geolocation.getCurrentPosition(
      p=>res({ loc:{ lat:+p.coords.latitude.toFixed(6), lng:+p.coords.longitude.toFixed(6), acc:Math.round(p.coords.accuracy) } }),
      e=>res({ loc:null, note: e.code===1 ? 'Location permission was denied.' : 'Location unavailable.' }),
      { enableHighAccuracy:true, timeout:15000, maximumAge:60000 });
  });
}
function compressImage(file){
  return new Promise((res,rej)=>{
    const img=new Image(), url=URL.createObjectURL(file);
    img.onload=()=>{
      let w=img.naturalWidth, h=img.naturalHeight; const max=1100; if(Math.max(w,h)>max){ const r=max/Math.max(w,h); w=Math.round(w*r); h=Math.round(h*r); }
      const cv=document.createElement('canvas'); cv.width=w; cv.height=h; cv.getContext('2d').drawImage(img,0,0,w,h);
      let q=.7, out=cv.toDataURL('image/jpeg',q); while(out.length>600000 && q>.3){ q-=.1; out=cv.toDataURL('image/jpeg',q); }
      URL.revokeObjectURL(url); res(out);
    };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('Couldn’t read that photo.')); };
    img.src=url;
  });
}

  }catch(e){ console.error(e); p.err='Couldn’t save: '+(e.message||e.code)+'. Check your signal and try again.'; }

function evalDefaults(e){

function overlay(){

  if(a==='ast'){ ui.ast=el.value; render(); }
  if(a==='sperson'){ ui.station.personId=el.value; render(); }
  if(a==='sevent'){ ui.station.eventKey=el.value; render(); }
  if(a==='sdue'){ ui.station.due=el.value; }
  if(a==='sto'){ ui.station.toOffice=el.value; render(); }
  if(a==='spick' && el.value){ ui.station.items.push(el.value); render(); }
  if(a==='aoff'){ ui.auditOffice=el.value; render(); }
  if(a==='acond'){ ui.auditCond=el.value; }
  if(a==='akind'){ ui.assetForm.kind=el.value; render(); }
  if(a==='date' && el.value){ ui.date=el.value; render(); }
  if(a==='me'){ ui.me=el.value; lsSet('peHub.me', el.value||null); render(); }
  if(a==='pickOther' && el.value){ const e=linkedEvent(), d=e&&e.days.find(x=>x.date===todayIso()); if(!d) return; ui.me=el.value; lsSet('peHub.me',ui.me);
    const id=dayId(e,d), cid=checkinId(id,ui.me); if(S.checkins[cid]){ render(); return; }
    ui.panel={type:'in', shift:{ev:e,day:d,dayId:id,personId:ui.me,cid}, cid, pid:ui.me, unscheduled:true, gear:[], loc:null, locNote:'', photo:''}; render(); fetchLoc(); }
  if(a==='photo' && el.files && el.files[0]){
    const p=ui.panel; if(p.type==='in') p.note=(document.querySelector('[data-keep="in-note"]')||{}).value;
    try{ p.photo=await compressImage(el.files[0]); p.err=''; }catch(e){ p.err=e.message; }
    render();
  }
});
document.addEventListener('submit', async ev=>{
  const f=ev.target; ev.preventDefault();
  if(f.dataset.form==='signin'){ signIn(f.email.value.trim(), f.pw.value); return; }
  if(f.dataset.form==='asset'){ await saveAssetForm(f); }
  if(f.dataset.form==='training'){ await saveTrainingForm(f); }

});
window.addEventListener('popstate', ()=>{ if(MARKETER_MODE) return; const h=location.hash.replace('#',''); ui.tab=SECTIONS[h]?h:'home'; ui.evalKey=null; ui.evalDraft=null; render(); });
document.addEventListener('keydown', e=>{ if(e.key==='Enter' && e.target.dataset && e.target.dataset.scan){ e.preventDefault(); const tg=e.target.dataset.scan, v=e.target.value; e.target.value=''; onScan(tg, v); setTimeout(()=>{ const n=document.querySelector(`[data-scan="${tg}"]`); n&&n.focus(); },0); return; }
  if(e.key==='Enter' && e.target.classList && e.target.classList.contains('tile')){ e.target.click(); return; } if(e.key==='Escape' && (ui.panel||ui.assetForm||ui.detail||ui.lightbox||ui.item||ui.mgrEditOpen||ui.tForm) && !ui.busy){ ui.panel=null; ui.assetForm=null; ui.detail=null; ui.item=null; ui.scanMsg=null; ui.mgrEditOpen=false; ui.tForm=null; ui.lightbox=null; render(); } });
setInterval(()=>{ if(!ui.panel && !ui.assetForm && !ui.item && !ui.exp && !document.activeElement.matches('input,textarea,select')) render(); }, 60000); // keep "Late" status current
