<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Patio Enclosures Marketer Schedule</title>
<style>
:root{
  --bg:#f5f6f4; --surface:#ffffff; --ink:#18221c; --ink-soft:#5a6760; --line:#d8dfda; --line-soft:#ecf0ed;
  --accent:#24583f; --accent-soft:#e6f0ea; --warn:#a15c00; --warn-soft:#fdf1df; --red:#b42318;
  --tent:#7a5af8; --tent-soft:#f1edfe; --chip:#eef2ef;
  --font:"Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1400px;margin:0 auto;padding:16px}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.brand{display:flex;flex-direction:column;justify-content:center;background:var(--accent);color:#fff;border-radius:9px;padding:7px 14px;line-height:1.15;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.brand b{font-size:17px;letter-spacing:.01em}
.brand span{font-size:10.5px;opacity:.85;text-transform:uppercase;letter-spacing:.09em}
header.top h1{font-size:22px;margin:0;font-weight:650;letter-spacing:-.01em}
header.top .asof{color:var(--ink-soft);font-size:13px}
.spacer{flex:1}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:14px}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 12px;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--line-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.on{background:var(--accent-soft);border-color:#9cc3ad;color:var(--accent);font-weight:600}
.btn[disabled]{opacity:.55;cursor:default}
select,input[type=date],input[type=text],input[type=email],input[type=password],input[type=number]{border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface)}
.weeknav{display:flex;align-items:center;gap:6px}
.weeklabel{font-weight:600;min-width:190px;text-align:center;white-space:nowrap}
label.chk{display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:16px}
.card h2{font-size:16px;margin:0 0 4px;font-weight:650}
.card .sub{color:var(--ink-soft);font-size:13px;margin-bottom:12px}
.empty{color:var(--ink-soft);padding:20px;text-align:center}
.hint{color:var(--ink-soft);font-size:12.5px}
.notice{background:var(--accent-soft);border:1px solid #c3dacb;color:var(--accent);border-radius:8px;padding:8px 12px;margin-bottom:14px;font-size:13px}
.need{font-size:11.5px;color:var(--red);font-weight:600}
.loan{display:inline-block;font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 6px;background:#e6eef8;color:#2f5f9e;margin-left:4px}
.cellshift.loaned{opacity:.75;border-left:3px solid #2f5f9e;padding-left:5px}
.staffwarn{background:var(--warn-soft);border:1px solid #f0d3a6;border-radius:10px;padding:12px 14px;margin-bottom:14px}
.staffwarn h2{font-size:15px;margin:0 0 6px;color:var(--warn)}
.staffwarn table{border-collapse:collapse;width:100%;font-size:13px}
.staffwarn td{padding:4px 6px;border-top:1px solid #f3e1c4;vertical-align:top}
.emailprev{border:1px solid var(--line);border-radius:8px;padding:12px;max-height:340px;overflow:auto;background:#fff}
.rlist .r input.em{width:200px}
.trow{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:3px 6px;align-items:center;margin-bottom:9px;max-width:300px}
.trow>span:first-child{grid-column:1/-1;font-weight:600;font-size:12.5px}
.trow>span:last-child{grid-column:1/-1}
.trow>span:last-child:empty{display:none}
.trow select{width:100%;min-width:0;padding:5px 4px;font-size:13px}
.chip a.chipname{color:inherit;text-decoration:none;border-bottom:1px dotted currentColor}
.chip .ptime{font-size:10.5px;font-weight:700;color:#2f5f9e;margin-left:4px}
.shiftedit{background:#f4f8f5;border:1px solid var(--line);border-radius:8px;padding:8px;margin:4px 0 6px}
.shiftedit .shl{display:block;font-size:12px;font-weight:600;margin-bottom:5px}
.shiftedit .shl select{display:block;width:100%;margin-top:2px;padding:5px 4px}
.shiftedit .shb{display:flex;flex-wrap:wrap;gap:4px}
.weekhead{font-size:14px;margin:14px 0 6px;color:var(--ink-soft)}
.weekhead:first-child{margin-top:4px}
.tag{display:inline-block;font-size:10.5px;font-weight:700;border-radius:8px;padding:1px 6px;background:var(--tent-soft);color:var(--tent);margin-left:4px;vertical-align:middle}
/* assign strip */
.days7{display:grid;grid-template-columns:repeat(7,minmax(150px,1fr));gap:8px;overflow-x:auto}
.daycol{background:var(--bg);border-radius:8px;padding:8px;min-height:80px}
.daycol h3{font-size:12.5px;margin:0 0 6px;color:var(--ink-soft);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.shift{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:7px;padding:7px 8px;margin-bottom:7px}
.shift .t{font-weight:600;font-size:12.5px}
.shift .n{font-size:13px;font-weight:600;margin:1px 0}
.shift .v{font-size:12px;color:var(--ink-soft)}
.shift select{width:100%;font-size:12px;padding:4px 6px}
.chips{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 5px}
.chip{background:var(--chip);border-radius:12px;padding:2px 4px 2px 9px;font-size:12px;display:inline-flex;align-items:center;gap:2px}
.chip.conflict{background:var(--warn-soft);color:var(--warn)}
.chip button{border:none;background:none;cursor:pointer;color:var(--ink-soft);padding:0 4px;font-size:12px}
/* grid */
.gridwrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;min-width:980px;table-layout:fixed}
table.grid th,table.grid td{border:1px solid var(--line);padding:7px 8px;vertical-align:top;text-align:left}
table.grid thead th{background:var(--accent);color:#fff;font-weight:600;font-size:13px}
table.grid thead th .d{font-weight:400;opacity:.85;font-size:12px;display:block}
table.grid th.emp{width:150px}
table.grid th.hrs,table.grid td.hrs{width:78px;text-align:center}
table.grid thead th.hrs .d{display:block;font-weight:400;opacity:.85;font-size:10.5px}
table.grid tbody th{background:var(--accent-soft);font-weight:600;font-size:13px}
table.grid tbody th .off{display:block;font-weight:400;color:var(--ink-soft);font-size:11.5px}
table.grid tbody th .hpi{display:block;width:max-content}
table.grid td{font-size:12.5px}
table.grid td.off{background:repeating-linear-gradient(45deg,#fafbfa,#fafbfa 6px,#f2f5f3 6px,#f2f5f3 12px);color:var(--ink-soft);text-align:center;vertical-align:middle}
table.grid td.hrs .d{display:block;font-size:10.5px;color:var(--ink-soft)}
table.grid td.hrs.over{background:#fde8e7;color:#b42318}
table.grid td.hrs.over .d{color:#b42318;font-weight:600}
.cellshift+.cellshift{border-top:1px dashed var(--line);margin-top:6px;padding-top:6px}
.cellshift .t{font-weight:700}
.cellshift .n{font-weight:600}
.cellshift .v{color:var(--ink-soft)}
.cellshift.conflict .t{color:var(--warn)}
.hpi{display:inline-block;font-size:11px;font-weight:600;border-radius:8px;padding:1px 7px;margin-top:3px;background:var(--chip);color:var(--ink-soft)}
.hpi.g{background:#e6f4ea;color:#1e7b34}.hpi.y{background:#fdf1df;color:#a15c00}.hpi.r{background:#fde8e7;color:#b42318}
/* details */
.details{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px}
.det{border:1px solid var(--line);border-radius:9px;padding:12px;background:var(--surface);break-inside:avoid}
.det h3{margin:0 0 2px;font-size:15px}
.det .office{color:var(--ink-soft);font-size:12.5px;margin-bottom:8px}
.det dl{display:grid;grid-template-columns:110px 1fr;gap:3px 10px;margin:0;font-size:13px}
.det dt{color:var(--ink-soft)}
.det dd{margin:0;word-break:break-word}
.det a{color:var(--accent)}
.det .detin{width:100%;font:inherit;font-size:13px;border:1px solid var(--line);border-radius:7px;padding:6px 8px;background:var(--surface)}
.det textarea.detin{min-height:64px;resize:vertical}
.det .detbtns{margin-top:4px}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(16,24,20,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;z-index:50;overflow:auto}
.modal{background:var(--surface);border-radius:12px;max-width:680px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h2{margin:0 0 10px;font-size:18px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
.modal textarea{width:100%;min-height:90px;border:1px solid var(--line);border-radius:7px;padding:8px;font:inherit}
.rlist{max-height:340px;overflow:auto;border:1px solid var(--line);border-radius:8px}
.rlist .r{display:flex;align-items:center;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.rlist .r:last-child{border-bottom:none}
.rlist .r .nm{flex:1;font-weight:600;min-width:140px}
.rlist .r .of{color:var(--ink-soft);font-size:12.5px}
.rlist .r .hpi{margin:0}
.rlist .r input[type=number]{width:82px;font-size:12.5px;padding:3px 6px}
/* build / save */
.savebar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:var(--bg);margin-bottom:12px;position:sticky;top:8px;z-index:30;box-shadow:0 4px 14px rgba(16,24,20,.08)}
.savebar.dirty{background:var(--warn-soft);border-color:#f3d19e}
.cstat{font-weight:600}.cstat.live{color:#1e7b34}.cstat.local,.cstat.connecting{color:var(--ink-soft)}
.signin input{min-width:200px}
details.build>summary{list-style:none;cursor:pointer;display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
details.build>summary::-webkit-details-marker{display:none}
details.build>summary h2{margin:0}
details.build>summary::before{content:'▸';color:var(--ink-soft);font-size:14px}
details.build[open]>summary::before{content:'▾'}
details.build[open]>summary{margin-bottom:12px}
.buildbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:10px}
h3.bh{font-size:14px;margin:18px 0 4px}
.allrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.allrow select{max-width:280px}
.pbs{margin-top:10px;border-collapse:collapse;font-size:12.5px}
.pbs th,.pbs td{border:1px solid var(--line);padding:4px 10px;text-align:left}
.pbs th{background:var(--bg);font-weight:600}
.print-only{display:none}
.mylist{display:none}
.myday{display:grid;grid-template-columns:70px 1fr;gap:10px;padding:9px 4px;border-bottom:1px solid var(--line-soft);font-size:13px}
.myday.offday{color:var(--ink-soft)}
.myday .dl{color:var(--ink-soft)} .myday .dl b{color:var(--ink);display:block}
.mytot{padding:10px 4px 0;font-weight:600;font-size:13px}
@media (max-width:700px){
  .mylist{display:block}
  .gridwrap.me{display:none}
  .weeklabel{min-width:0;font-size:13px}
  .weeknav{flex-wrap:wrap;width:100%}
}
@media print{
  @page{size:landscape;margin:10mm}
  body{background:#fff;font-size:11px}
  .wrap{max-width:none;padding:0}
  .toolbar,.no-print,.notice,.cstat{display:none!important}
  .print-only{display:block}
  .card{border:none;padding:0;margin-bottom:10px}
  table.grid{min-width:0}
  table.grid thead th{background:#18221c!important;color:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table.grid tbody th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .gridwrap{overflow:visible}
  .gridwrap.me{display:block!important}
  .mylist{display:none!important}
  .details{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<script>

let data = { events:[], roster:[], assignments:{}, shiftTimes:{}, details:{}, importedAt:null, dataAsOf:null, sourceFile:'', rosterAsOf:null, hpiAsOf:null };
let ui = { weekStart: sundayOf(todayIso()), weeks:1, office:'', region:'', showAllRoster:false, modal:null, notice:'', person:'', buildOpen:false, editDet:null, detDraft:null };

/* ---------- storage ---------- */
function load(){
  try{ const raw = localStorage.getItem(STORE_KEY); if(raw) data = Object.assign(data, JSON.parse(raw)); }catch(e){}
  try{ const u = JSON.parse(localStorage.getItem(STORE_KEY+'-ui')||'{}'); if(u.office!==undefined) ui.office=u.office; if(u.region) ui.region=u.region; if(u.weeks) ui.weeks=u.weeks; if(u.person) ui.person=u.person; }catch(e){}
}
function saveLocal(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(data)); }catch(e){ if(cloud.status!=='live') ui.notice = 'Could not save in this browser (storage is blocked or full). Use Backup to keep a copy.'; }
  try{ localStorage.setItem(STORE_KEY+'-ui', JSON.stringify({office:ui.office, region:ui.region||'', person:ui.person||'', weeks:ui.weeks||1})); }catch(e){}
}
// When signed in, changes are a draft until the manager clicks "Save schedule".
function save(){ saveLocal(); if(cloud.status==='live' && cloud.user){ cloud.dirty = unsavedDocs().length>0; } }
function unsavedDocs(){ return DOCS.filter(n=>cloud.pushed[n] !== JSON.stringify(cloudPayload(n))); }
async function saveSchedule(){
  if(!(cloud.status==='live' && cloud.user)) return;
  cloud.saving = true; cloud.saveErr = ''; render();
  const ok = await pushCloud();
  cloud.saving = false; cloud.dirty = unsavedDocs().length>0;
  if(ok){ cloud.savedAt = new Date(); ui.notice=''; }
  render();
}
function discardChanges(){
  if(!confirm('Discard your unsaved changes and go back to the last saved schedule?')) return;
  DOCS.forEach(n=>applyCloud(n, cloud.remote[n]||null, true));
  cloud.dirty = false; render();
}
window.addEventListener('beforeunload', e=>{ if(cloud.dirty){ e.preventDefault(); e.returnValue=''; } });

/* ---------- shared storage (Firebase) ----------
   Patio Enclosures "Event Management Dashboard" project (event-management-dashboa-caf40), its own
   collection "patioEnclosuresSchedule" with three documents: events, roster, assignments. Anyone with
   the link can READ; only a signed-in dashboard account tagged brand = patio-enclosures can WRITE:
     (A fourth document, "details", holds booth location / set-up notes typed on event cards.)
     match /patioEnclosuresSchedule/{docId} {
       allow read: if true;
       allow write: if request.auth != null && request.auth.token.brand == 'patio-enclosures';
     } */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyAcff37-OjCVKkY83HiSA3iwSkqYQOlxVQ",
  authDomain: "event-management-dashboa-caf40.firebaseapp.com",
  projectId: "event-management-dashboa-caf40",
  messagingSenderId: "1028378762774",
  appId: "1:1028378762774:web:65b77aa3527586a0be5f37"
};
const CLOUD_COLL = 'patioEnclosuresSchedule';
const FB_VER = '10.12.2';
const cloud = { status:'connecting', user:null, fb:null, loaded:{}, pushed:{}, remote:{}, dirty:false, saving:false, savedAt:null, err:'', saveErr:'', authErr:'', authNote:'' };
function canEdit(){ return cloud.status!=='live' || !!cloud.user; }
function clean(o){ return JSON.parse(JSON.stringify(o)); }
function cloudPayload(name){
  if(name==='events') return clean({ list:data.events.map(e=>Object.assign({}, e, { days:e.days.map(d=>({ date:d.date, start:('_s' in d)?d._s:d.start, stop:('_t' in d)?d._t:d.stop })) })), dataAsOf:data.dataAsOf||null, sourceFile:data.sourceFile||'', importedAt:data.importedAt||null });
  if(name==='roster') return clean({ list:data.roster, rosterAsOf:data.rosterAsOf||null, hpiAsOf:data.hpiAsOf||null });
  // Booth location / setup notes typed on event cards, kept apart from the ETACC import so re-imports keep them.
  if(name==='details') return { list: Object.entries(data.details||{}).filter(([k,v])=>v && (v.booth||v.setup||Object.keys(v.times||{}).length)).map(([key,v])=>({ key, booth:v.booth||'', setup:v.setup||'', times:Object.entries(v.times||{}).map(([date,t])=>({ date, start:t.start||'', stop:t.stop||'' })) })) };
  // Firestore can't store an array inside an array, so each assignment is an object.
  // Partial shifts: hours for one marketer on one event day, kept with that day's assignment.
  return { list: Object.entries(data.assignments).filter(([k,v])=>v && v.length).map(([id,people])=>{ const times={}; people.forEach(pid=>{ const t=(data.shiftTimes||{})[id+'::'+pid]; if(t&&(t.start||t.stop)) times[pid]={start:t.start||'',stop:t.stop||''}; }); return Object.keys(times).length ? { id, people, times } : { id, people }; }) };
}
async function pushCloud(only){
  if(!(cloud.status==='live' && cloud.user && cloud.fb)) return false;
  const {fsM, db} = cloud.fb;
  for(const name of (only || DOCS)){
    const body = cloudPayload(name), sig = JSON.stringify(body);
    if(cloud.pushed[name] === sig) continue;
    try{
      await fsM.setDoc(fsM.doc(db, CLOUD_COLL, name), Object.assign({}, body, { updatedAt: Date.now(), updatedBy: cloud.user.email || '' }));
      cloud.pushed[name] = sig;
    }catch(e){
      console.error('Save to Firebase failed', name, e);
      cloud.saveErr = e.code==='permission-denied'
        ? 'Firebase refused the save (permission). Check that the patioEnclosuresSchedule rule is published in Firestore → Rules, and that this account has the patio-enclosures brand tag.'
        : `Couldn’t save to Firebase: ${e.message||e.code}`;
      render(); return false;
    }
  }
  return true;
}
function applyCloud(name, d, force){
  cloud.loaded[name] = d ? 'yes' : 'missing';
  cloud.remote[name] = d;
  // Someone else saved while this manager has unsaved edits to the same part: keep the draft.
  if(!force && d && cloud.dirty && cloud.pushed[name] !== JSON.stringify(cloudPayload(name))){
    if(cloud.user && d.updatedBy && d.updatedBy !== cloud.user.email) ui.notice = `${d.updatedBy} saved changes to the ${name} while you were editing. Saving now will replace theirs with yours.`;
    render(); return;
  }
  if(d){
    if(name==='events'){ data.events = d.list||[]; data.dataAsOf = d.dataAsOf||null; data.sourceFile = d.sourceFile||''; data.importedAt = d.importedAt||null; }
    if(name==='roster'){ data.roster = d.list||[]; data.rosterAsOf = d.rosterAsOf||null; data.hpiAsOf = d.hpiAsOf||null; }
    if(name==='assignments'){ data.assignments = Object.fromEntries((d.list||[]).map(x=>[x.id, x.people||[]]).filter(x=>x[0] && Array.isArray(x[1]))); data.shiftTimes={}; (d.list||[]).forEach(x=>Object.entries(x.times||{}).forEach(([pid,t])=>{ data.shiftTimes[x.id+'::'+pid]={start:t.start||'',stop:t.stop||''}; })); }
    if(name==='details'){ data.details = Object.fromEntries((d.list||[]).filter(x=>x.key).map(x=>[x.key, { booth:x.booth||'', setup:x.setup||'', times:Object.fromEntries((x.times||[]).filter(t=>t.date).map(t=>[t.date,{start:t.start||'',stop:t.stop||''}])) }])); }
    cloud.pushed[name] = JSON.stringify(cloudPayload(name));
  } else if(force){
    if(name==='events'){ data.events=[]; data.dataAsOf=null; data.sourceFile=''; data.importedAt=null; }
    if(name==='roster'){ seedRoster(); }
    if(name==='assignments'){ data.assignments={}; data.shiftTimes={}; }
    if(name==='details'){ data.details={}; }
  }
  saveLocal(); render();
}
async function initCloud(){
  const timeout = setTimeout(()=>{ if(cloud.status==='connecting'){ cloud.status='local'; cloud.err='timeout'; render(); } }, 10000);
  try{
    const base = `https://www.gstatic.com/firebasejs/${FB_VER}/`;
    const [appM, authM, fsM] = await Promise.all([import(base+'firebase-app.js'), import(base+'firebase-auth.js'), import(base+'firebase-firestore.js')]);
    const app = appM.initializeApp(FIREBASE_CONFIG, 'pe-marketer-schedule');
    const auth = authM.getAuth(app), db = fsM.getFirestore(app);
    cloud.fb = { authM, fsM, auth, db };
    authM.onAuthStateChanged(auth, u=>{ cloud.user = u; cloud.authErr=''; if(u && DOCS.every(n=>cloud.loaded[n])) cloud.dirty = unsavedDocs().length>0; render(); });
    let failed = false;
    DOCS.forEach(name=>{
      fsM.onSnapshot(fsM.doc(db, CLOUD_COLL, name),
        snap=>{ clearTimeout(timeout); cloud.status='live'; applyCloud(name, snap.exists() ? snap.data() : null); if(cloud.user && DOCS.every(n=>cloud.loaded[n])){ cloud.dirty = unsavedDocs().length>0; render(); } },
        err=>{ if(failed) return; failed = true; clearTimeout(timeout); cloud.status='local'; cloud.err = err.code||err.message; render(); });
    });
  }catch(e){ clearTimeout(timeout); cloud.status='local'; cloud.err = e.message||'unavailable'; render(); }
}
async function signIn(email, pw){
  cloud.authErr=''; cloud.authNote='';
  if(!cloud.fb) return;
  try{ await cloud.fb.authM.signInWithEmailAndPassword(cloud.fb.auth, email, pw); }
  catch(e){ cloud.authErr = ['auth/invalid-credential','auth/wrong-password','auth/user-not-found','auth/invalid-email'].includes(e.code) ? 'Incorrect email or password.' : `Sign-in failed: ${e.code||e.message}`; render(); }
}
async function resetPw(email){
  cloud.authErr=''; cloud.authNote='';
  if(!email){ cloud.authErr='Type your email first, then click Forgot password.'; render(); return; }
  try{ await cloud.fb.authM.sendPasswordResetEmail(cloud.fb.auth, email); }catch(e){ if(e.code==='auth/invalid-email'){ cloud.authErr='That email doesn’t look right.'; render(); return; } }
  cloud.authNote = `If ${email} has an account, a reset link is on its way (check spam).`; render();
}

/* ---------- dates ---------- */
function pad(n){ return String(n).padStart(2,'0'); }
function isoOf(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }
function todayIso(){ return isoOf(new Date()); }
function parseIso(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(iso,n){ const d=parseIso(iso); d.setDate(d.getDate()+n); return isoOf(d); }
function sundayOf(iso){ const d=parseIso(iso); d.setDate(d.getDate()-d.getDay()); return isoOf(d); }
function weekDays(){ return [0,1,2,3,4,5,6].map(i=>addDays(ui.weekStart,i)); }
// Viewing / emailing range: 1–8 weeks starting with the selected week. Building, PBS limits and
// the assign area stay one week at a time.
function viewDays(){ const n=Math.max(1, Math.min(8, +ui.weeks||1)); return Array.from({length:n*7}, (_,i)=>addDays(ui.weekStart,i)); }
function viewLabel2(){ const v=viewDays(); return `${fmtFull(v[0])} – ${fmtFull(v[v.length-1])}`; }
const DOW = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function fmtMD(iso){ const d=parseIso(iso); return `${d.getMonth()+1}/${d.getDate()}`; }
function fmtLong(iso){ return parseIso(iso).toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'}); }
function fmtFull(iso){ return parseIso(iso).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function normDate(v){
  v = String(v||'').trim(); if(!v) return '';
  let m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/); if(m) return `${m[1]}-${pad(+m[2])}-${pad(+m[3])}`;
  m = v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/); if(m){ const y = m[3].length===2 ? '20'+m[3] : m[3]; return `${y}-${pad(+m[1])}-${pad(+m[2])}`; }
  if(/^\d{5}(\.\d+)?$/.test(v)){ const d=new Date(Date.UTC(1899,11,30)+Math.floor(+v)*864e5); return `${d.getUTCFullYear()}-${pad(d.getUTCMonth()+1)}-${pad(d.getUTCDate())}`; } // Excel serial
  const t = Date.parse(v.replace(/^(mon|tue|wed|thu|fri|sat|sun)[a-z]*,?\s+/i,'')); // "Oct 30, 2026", "October 30 2026"
  if(!isNaN(t)){ const d=new Date(t); if(d.getFullYear()>2000) return isoOf(d); }
  return '';
}
function toMin(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+(m||0); }
function parseTime(txt){
  const m = String(txt||'').trim().match(/^(\d{1,2}):(\d{2})\s*([AaPp][Mm])?$/); if(!m) return '';
  let h=+m[1]; if(m[3]){ const pm=/p/i.test(m[3]); if(h===12) h=pm?12:0; else if(pm) h+=12; }
  return `${pad(h)}:${m[2]}`;
}
function fmtTime(t){ const x=toMin(t); if(x===null) return ''; const h=Math.floor(x/60)%24, m=x%60; return `${((h+11)%12)+1}${m?':'+pad(m):''}${h>=12?'p':'a'}`; }
// Show-hour choices: 7:00 AM to 12:00 midnight in 30-minute steps.
const SHOW_TIMES = (()=>{ const a=[]; for(let m=7*60; m<=24*60; m+=30) a.push(`${pad(Math.floor(m/60))}:${pad(m%60)}`); return a; })();
function timeLabel(v){ const x=toMin(v); if(x===null) return ''; if(x===1440) return 'Midnight'; const h=Math.floor(x/60), m=x%60; return `${((h+11)%12)+1}:${pad(m)} ${h>=12?'PM':'AM'}`; }
function timeSelect(date, part, val, id){
  const opts = SHOW_TIMES.includes(val)||!val ? SHOW_TIMES : [val, ...SHOW_TIMES];
  return `<select ${id?`id="${id}"`:`data-tdate="${esc(date)}" data-tpart="${part}"`} aria-label="${part==='start'?'Start':'End'} time"><option value="">${part==='start'?'Start…':'End…'}</option>${opts.map(o=>`<option value="${o}" ${o===val?'selected':''}>${timeLabel(o)}</option>`).join('')}</select>`;
}
function timeRange(s){ return (s.start||s.stop) ? `${fmtTime(s.start)||'?'}–${fmtTime(s.stop)||'?'}` : 'Times TBD'; }
function shiftHours(s){ const a=toMin(s.start), b=toMin(s.stop); return (a!==null&&b!==null&&b>a)?(b-a)/60:0; }
function overlaps(a,b){ const a1=toMin(a.start),a2=toMin(a.stop),b1=toMin(b.start),b2=toMin(b.stop); if([a1,a2,b1,b2].some(x=>x===null)) return true; return a1<b2 && b1<a2; }

/* ---------- CSV ---------- */
function parseCSV(text){
  text = text.replace(/^\uFEFF/,'');
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c;
  }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==''));
}
function parseDaysHours(v){
  return String(v||'').split(/;|\n/).map(s=>s.trim()).filter(Boolean).map(seg=>{
    const m = seg.match(/^(\S+)(?:\s+(\d{1,2}:\d{2}\s*[AaPp]?[Mm]?))?(?:\s*[-–]\s*(\d{1,2}:\d{2}\s*[AaPp]?[Mm]?))?/);
    if(!m) return null; const date = normDate(m[1]); if(!date) return null;
    return { date, start: parseTime(m[2]), stop: parseTime(m[3]) };
  }).filter(Boolean);
}
function statusOk(v){ const x=String(v||'').trim().toLowerCase().replace(/\s+/g,' '); return INCLUDE_STATUSES.some(st=>x===st.toLowerCase()); }
function eventKey(office,name,start){ return [office,name,start].map(x=>String(x||'').trim().toLowerCase()).join('|'); }
function importCSV(text, file){
  const rows = parseCSV(text);
  if(rows.length<2){ alert('That file has no event rows.'); return; }
  const head = rows[0].map(h=>String(h).trim().toLowerCase().replace(/\s+/g,' '));
  // Accept a few alternate headings for the key columns.
  const ALIASES = { 'event name':['event name','event','event title','name','show name'], 'start date':['start date','event start','start','begin date','event date','date'],
    'end date':['end date','event end','end'], 'status':['status','approval status','event status','etacc status'], 'region':['region','market','office','territory'] };
  const col = name => { const n=name.toLowerCase(); for(const a of (ALIASES[n]||[n])){ const i=head.indexOf(a); if(i>=0) return i; } return -1; };
  const missing = ['event name','start date'].filter(n=>col(n)<0);
  if(missing.length){ alert('This doesn\'t look like an ETACC export. Missing column(s): '+missing.join(', ')+'.\n\nColumns found: '+rows[0].slice(0,25).join(', ')+'\n\nNothing was changed.'); return; }
  const hasStatus = col('status')>=0;
  const g = (r,n)=>{ const i=col(n); return i<0 ? '' : String(r[i]||'').trim(); };
  // If the export covers more than one brand, keep only the Patio Enclosures rows.
  const brandCol = head.findIndex(h=>/^(brand|company|division|business unit|line of business)$/.test(h));
  let body = rows.slice(1), brandNote = '';
  if(brandCol>=0 && body.some(r=>/patio/i.test(r[brandCol]||''))){
    const before = body.length; body = body.filter(r=>/patio/i.test(r[brandCol]||''));
    brandNote = `Kept the ${body.length} Patio Enclosures rows (skipped ${before-body.length} for other brands).`;
  }
  // Setup / load-in columns: any heading with "setup", "set up", "load in" or "move in".
  const setupCols = rows[0].map((h,i)=>({h:String(h).trim(), i})).filter(c=>/set\s*-?\s*up|load\s*-?\s*in|move\s*-?\s*in/i.test(c.h));
  const events=[]; let noDays=0, badDate=0, badDateEx='';
  const statusSeen = {};
  for(const r of body){
    const name=g(r,'Event Name'); if(!name) continue;
    const rawStatus=g(r,'Status');
    if(hasStatus){ statusSeen[rawStatus||'(blank)'] = (statusSeen[rawStatus||'(blank)']||0)+1; if(!statusOk(rawStatus)) continue; }
    const status = hasStatus ? INCLUDE_STATUSES.find(st=>st.toLowerCase()===rawStatus.trim().toLowerCase().replace(/\s+/g,' ')) : 'Approved';
    // Patio ETACC: Branch is the office (e.g. "BIR - Birmingham"); Region is the wider area (e.g. "SE").
    const region = g(r,'Region'), office = g(r,'Branch') || region || g(r,'Office');
    const start=normDate(g(r,'Start Date')), end=normDate(g(r,'End Date'))||start;
    if(!start){ badDate++; if(!badDateEx) badDateEx = g(r,'Start Date') || '(blank)'; continue; }
    let days = parseDaysHours(g(r,'Days & Hours'));
    if(!days.length){ noDays++; for(let d=start; d<=end && days.length<31; d=addDays(d,1)) days.push({date:d,start:'',stop:''}); }
    events.push({
      key: eventKey(office,name,start), name, office, region, status, start, end, days,
      venueName:g(r,'Venue Name'), venueAddress:g(r,'Venue Address'), zip:g(r,'Zip'),
      organizer:g(r,'Organizer'), contactName:g(r,'Contact Name'), contactPhone:g(r,'Contact Phone'), contactEmail:g(r,'Contact Email'),
      boothNumber:g(r,'Booth Number'), boothLocation:g(r,'Booth Location'), boothSize:g(r,'Booth Size'),
      setup: setupCols.map(c=>({label:c.h, value:String(r[c.i]||'').trim()})).filter(x=>x.value),
      notes:g(r,'Final Notes')
    });
  }
  if(!events.length){
    const st = Object.entries(statusSeen).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k,n])=>`${k} (${n})`).join(', ');
    const why = [`Found ${body.length} row${body.length===1?'':'s'} but none could be scheduled, so nothing was changed.`];
    if(brandNote) why.push(brandNote);
    if(hasStatus) why.push(`Only "Approved" and "Submitted for Contract" are kept. Statuses in this file: ${st || 'none'}.`);
    else why.push('This file has no Status column.');
    if(badDate) why.push(`${badDate} row${badDate===1?' had a':'s had a'} Start Date that couldn't be read (e.g. "${badDateEx}").`);
    alert(why.join('\n\n')); ui.notice = why.join(' '); render(); return;
  }
  // keep assignments only for event days that still exist
  const valid = new Set(); events.forEach(e=>e.days.forEach(d=>valid.add(dayId(e,d))));
  let dropped=0;
  Object.keys(data.assignments).forEach(k=>{ if(!valid.has(k)){ if((data.assignments[k]||[]).length) dropped++; delete data.assignments[k]; } });
  Object.keys(data.shiftTimes||{}).forEach(k=>{ if(!valid.has(k.split('::')[0])) delete data.shiftTimes[k]; });
  data.events = events;
  data.importedAt = new Date().toISOString();
  const fm = (file && file.name || '').match(/(\d{4}-\d{2}-\d{2})/);
  data.dataAsOf = fm ? fm[1] : (file && file.lastModified ? isoOf(new Date(file.lastModified)) : todayIso());
  data.sourceFile = file ? file.name : '';
  const parts = [`Imported ${events.length} event${events.length===1?'':'s'} from ${data.sourceFile||'the CSV'}.`];
  if(brandNote) parts.push(brandNote);
  if(!hasStatus) parts.push('No Status column was found, so every event was included.');
  if(badDate) parts.push(`${badDate} skipped because the Start Date couldn't be read (e.g. "${badDateEx}").`);
  if(noDays) parts.push(`${noDays} had no Days & Hours filled in ETACC, so their days show "Times TBD".`);
  if(dropped) parts.push(`${dropped} assigned day${dropped===1?'':'s'} no longer match an event (dates or name changed in ETACC) and were cleared.`);
  ui.notice = parts.join(' ');
  save(); render();
}

/* ---------- roster ---------- */
// UKG lists "Last, First Middle" -> "First Last" (suffixes like Jr stay with the last name).
function cleanName(n){
  n = String(n||'').trim().replace(/\s+/g,' ');
  const i = n.indexOf(','); if(i<0) return n;
  const last = n.slice(0,i).trim(), first = n.slice(i+1).trim().split(' ')[0];
  return first ? `${first} ${last}` : last;
}
function isMgrTitle(t){ return /manager|mgr|director/i.test(String(t||'')); }
function seedRoster(){
  data.roster = ROSTER_SEED.map(([n,title,hire])=>({ id:uid(), name:cleanName(n), office:'', mgr:isMgrTitle(title), title, hire:normDate(hire) }));
  data.rosterAsOf = ROSTER_SEED_ASOF;
}
function mergeRoster(list){
  let added=0, moved=0, updated=0;
  list.forEach(p=>{
    if(!p.name) return;
    const hit = data.roster.find(r=>r.name.toLowerCase()===p.name.toLowerCase());
    const stats = ('hpi' in p || 'hrs' in p) ? { hpi:p.hpi??null, hrs:p.hrs??null, iss:p.iss??null } : {};
    if(hit){
      if(p.office && hit.office!==p.office){ hit.office=p.office; moved++; }
      if('mgr' in p) hit.mgr=!!p.mgr;
      if(p.title) hit.title=p.title; if(p.hire) hit.hire=p.hire; if(p.email) hit.email=p.email;
      if(Object.keys(stats).length){ Object.assign(hit, stats); updated++; }
    } else { data.roster.push(Object.assign({ id:uid(), name:p.name, office:p.office||'', mgr:!!p.mgr }, p.email?{email:p.email}:{}, p.title?{title:p.title}:{}, p.hire?{hire:p.hire}:{}, stats)); added++; }
  });
  return {added, moved, updated};
}
// Reads a roster spreadsheet saved as CSV. Needs a Name column (or First/Last). Optional columns:
// Office/Region/Market, Manager (yes/no) or Title/Role, Hrs/Issued, or Hours + Issued.
function importRosterCSV(text, file){
  const rows = parseCSV(text);
  if(rows.length<2){ alert('That file has no rows.'); return; }
  const head = rows[0].map(h=>h.trim().toLowerCase());
  const exact = (...names)=>head.findIndex(h=>names.includes(h));
  const like = re=>head.findIndex(h=>re.test(h));
  const iName = exact('name','employee','employee name','marketer','full name');
  const iFirst = exact('first name','first'), iLast = exact('last name','last');
  const iOffice = like(/^(office|region|market|location|branch)/), iEmail = like(/e-?mail/);
  let iMgr = like(/job title|^title$|^role$/); if(iMgr<0) iMgr = like(/primary position|^position$|manager|mgr/);
  const iStatus = like(/employee status|^status$/), iHire = like(/hire date/);
  const iHpi = like(/hrs\s*\/\s*issued|hours\s*(\/|per)\s*issued|hrs\s*per\s*issued/);
  const iHrs = head.findIndex((h,i)=>i!==iHpi && /^(hours|hrs)(\s*worked)?$/.test(h));
  const iIss = head.findIndex((h,i)=>i!==iHpi && /^(issued|issued leads|iss)$/.test(h));
  if(iName<0 && iFirst<0){ alert('Couldn’t find a Name column. The first row needs a "Name" (or "First Name" and "Last Name") heading.'); return; }
  const num = v=>{ const s=String(v||'').replace(/[^\d.]/g,''); if(!s) return null; const x=parseFloat(s); return isNaN(x)?null:x; };
  const list=[];
  rows.slice(1).forEach(r=>{
    const get = i=>i<0 ? '' : String(r[i]||'').trim();
    const name = cleanName(iName>=0 ? get(iName) : [get(iFirst),get(iLast)].filter(Boolean).join(' '));
    if(!name || /^count of|^report total/i.test(name)) return;
    if(iStatus>=0 && get(iStatus) && !/^active/i.test(get(iStatus))) return;
    const p = { name, office:get(iOffice) }; if(iEmail>=0 && /@/.test(get(iEmail))) p.email = get(iEmail);
    if(iMgr>=0){ const m=get(iMgr); p.mgr = /^(y|yes|true|1|x)$/i.test(m) || isMgrTitle(m); if(/[a-z]{3}/i.test(m)) p.title = m.replace(/^[A-Z]+-/,''); }
    if(iHire>=0 && normDate(get(iHire))) p.hire = normDate(get(iHire));
    if(!p.mgr && (iHpi>=0 || iHrs>=0)){
      const hp=num(get(iHpi)), h=num(get(iHrs)), is=num(get(iIss));
      p.hpi = hp!==null ? Math.round(hp*10)/10 : (h!==null && is) ? Math.round(h/is*10)/10 : null;
      p.hrs = h; p.iss = is;
    }
    list.push(p);
  });
  const {added, moved, updated} = mergeRoster(list);
  data.rosterAsOf = todayIso();
  if(iHpi>=0 || iHrs>=0) data.hpiAsOf = todayIso();

function hpiText(p){ if(!p) return ''; if(p.mgr) return 'Manager'; if(p.hpi!=null) return `${p.hpi} hrs/issued`; if(p.hrs && p.iss===0) return '0 issued'; return ''; }

  return parts.join('');

document.addEventListener('click', e=>{
  const t = e.target.closest('[data-act],[data-unassign],[data-delperson],[data-shiftedit]');
  if(t && t.dataset.shiftedit){ e.preventDefault(); if(canEdit()){ ui.editShift = ui.editShift===t.dataset.shiftedit ? null : t.dataset.shiftedit; render(); } return; }
  if(!t) return;
  if((t.dataset.unassign || t.dataset.delperson) && !canEdit()) return;
  if(t.dataset.unassign){
    const id=t.dataset.unassign, pid=t.dataset.pid;
    data.assignments[id] = assigned(id).filter(x=>x!==pid); if(!data.assignments[id].length) delete data.assignments[id];
    if(data.shiftTimes) delete data.shiftTimes[shiftKey(id,pid)]; if(ui.editShift===shiftKey(id,pid)) ui.editShift=null;
    save(); render(); return;
  }
  if(t.dataset.delperson){
    const p = person(t.dataset.delperson);
    if(p && confirm(`Remove ${p.name} from the roster and from every shift they're on?`)){
      data.roster = data.roster.filter(r=>r.id!==p.id);
      Object.keys(data.assignments).forEach(k=>{ data.assignments[k]=data.assignments[k].filter(x=>x!==p.id); if(!data.assignments[k].length) delete data.assignments[k]; });
      save(); render();

      setTimeout(()=>{ const el=document.getElementById('detBooth'); el && el.focus && el.focus(); },0); break;
    case 'detcancel': ui.editDet = null; ui.detDraft = null; render(); break;
    case 'detdone': {
      if(!canEdit()) break;
      const key=t.dataset.key, dd=readDetDraft()||{}, booth=(dd.booth||'').trim(), setup=(dd.setup||'').trim();
      const times={}; Object.entries(dd.times||{}).forEach(([dt,v])=>{ if(v.start||v.stop) times[dt]={start:v.start||'',stop:v.stop||''}; });
      const bad=Object.entries(times).find(([dt,v])=>v.start&&v.stop&&toMin(v.stop)<=toMin(v.start));
      if(bad){ alert(`The end time on ${fmtLong(bad[0])} is before the start time. Please fix it, then click Done.`); break; }
      data.details = data.details||{};
      if(booth || setup || Object.keys(times).length) data.details[key] = { booth, setup, times }; else delete data.details[key];
      ui.editDet = null; ui.detDraft = null; save(); render(); break;
    }
    case 'discard': discardChanges(); break;
    case 'shcancel': ui.editShift=null; render(); break;
    case 'shfull': { if(!canEdit()) break; delete (data.shiftTimes||{})[t.dataset.key]; ui.editShift=null; save(); render(); break; }
    case 'shsave': {
      if(!canEdit()) break;
      const k=t.dataset.key, st=document.getElementById('sh-start').value, sp=document.getElementById('sh-stop').value;

      const [id]=k.split('::'); const ev=data.events.find(e=>e.days.some(d=>dayId(e,d)===id)); const d=ev&&ev.days.find(x=>dayId(ev,x)===id);

    case 'next': ui.weekStart=addDays(ui.weekStart,7); render(); break;
    case 'today': ui.weekStart=sundayOf(todayIso()); render(); break;

      const blob = new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
      const url = URL.createObjectURL(blob); const link=document.createElement('a');
      link.href=url; link.download=`patio-enclosures-schedule-backup_${todayIso()}.json`; document.body.appendChild(link); link.click(); link.remove();
      setTimeout(()=>URL.revokeObjectURL(url),1000); break;
    }
    case 'restore': document.getElementById('backupFile').click(); break;
  }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset.moveperson){ const p=person(t.dataset.moveperson); if(p){ p.office=t.value; save(); render(); } return; }
  if(t.dataset.emailperson){ const p=person(t.dataset.emailperson); if(p){ p.email=t.value.trim(); save(); } return; }
  if(t.dataset.hpiperson){ const p=person(t.dataset.hpiperson); if(p){ const v=parseFloat(t.value); p.hpi = isNaN(v)||v<=0 ? null : Math.round(v*10)/10; data.hpiAsOf=todayIso(); save(); render(); } return; }
  if(t.dataset.assign){ if(t.value && canEdit()){ const id=t.dataset.assign; data.assignments[id]=[...assigned(id), t.value]; ui.editShift=shiftKey(id,t.value); save(); render(); } return; }
  switch(t.dataset.act){
    case 'region': ui.region=t.value; if(ui.office && regionOf(ui.office)!==ui.region && ui.region) ui.office=''; { const p=person(ui.person); if(p && !inView(p.office)) ui.person=''; } saveLocal(); render(); break;
    case 'office': ui.office=t.value; { const p=person(ui.person); if(p && !inView(p.office)) ui.person=''; } saveLocal(); render(); break;
    case 'allroster': ui.showAllRoster=t.checked; render(); break;
    case 'pick': if(t.value){ ui.weekStart=sundayOf(t.value); render(); } break;
    case 'person': ui.person=t.value; saveLocal(); render(); break;
    case 'weeks': ui.weeks=+t.value||1; saveLocal(); render(); break;
    case 'emailall': ui.emailAll=t.checked; render(); break;
  }
});
function readFile(input, fn){
  input.addEventListener('change', e=>{
    const f=e.target.files[0]; if(!f) return;
    const r=new FileReader(); r.onload=()=>{ fn(r.result, f); e.target.value=''; }; r.readAsText(f);
  });
}
readFile(document.getElementById('csvFile'), importCSV);
readFile(document.getElementById('rosterFile'), importRosterCSV);
readFile(document.getElementById('backupFile'), (text)=>{
  try{ const d=JSON.parse(text); if(!Array.isArray(d.events)||!Array.isArray(d.roster)) throw new Error('bad');
    if(confirm('Replace everything here with this backup?')){ data=Object.assign({events:[],roster:[],assignments:{},details:{}},d); ui.notice='Backup restored.'; save(); render(); } }
  catch(err){ alert('That file isn\'t a schedule backup.'); }
});
document.addEventListener('toggle', e=>{ if(e.target.matches && e.target.matches('[data-build]')) ui.buildOpen = e.target.open; }, true);
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && ui.modal){ ui.modal=null; render(); }
  else if(e.key==='Escape' && ui.editDet){ ui.editDet=null; ui.detDraft=null; render(); }
  if(e.key==='Enter' && e.target && (e.target.id==='siPw' || e.target.id==='siEmail')){ signIn(document.getElementById('siEmail').value.trim(), document.getElementById('siPw').value); }
});

load();
if(!data.roster.length) seedRoster();
render();
initCloud();
</script>
